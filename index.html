<script id="qbank" type="application/json">[{"id": "B1-Q01", "sys": "Cardiology", "discipline": "Emergency Medicine", "topic": "Right ventricular infarction with nitrate-induced hypotension", "difficulty": 3, "vignette": ["A 63-year-old man is brought to the emergency department 50 minutes after the onset of crushing substernal chest pressure that began while he was shoveling snow. He has hypertension, type 2 diabetes mellitus, and hyperlipidemia and smokes 1 pack of cigarettes daily. Medications are lisinopril, metformin, and atorvastatin. Paramedics gave him 325 mg of chewable aspirin en route.", "On arrival, temperature is 36.9 C (98.4 F), blood pressure is 122/78 mm Hg, pulse is 74/min, respirations are 18/min, and pulse oximetry shows 96% on room air. He is diaphoretic. The lungs are clear to auscultation. Heart sounds are regular with no murmurs. ECG shows 3-mm ST-segment elevations in leads II, III, and aVF, with greater elevation in lead III than in lead II; 1-mm ST-segment elevation in lead V1; and reciprocal ST-segment depressions in leads I and aVL. The cardiac catheterization laboratory is activated, and sublingual nitroglycerin is given for ongoing chest pain.", "Eight minutes later, the patient says he feels lightheaded. Blood pressure is 78/48 mm Hg and pulse is 88/min. Jugular venous pressure is 12 cm H<sub>2<\/sub>O. The lungs remain clear, and the extremities are cool."], "labs": [], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Dobutamine infusion", "B": "Intra-aortic balloon pump placement", "C": "Intravenous furosemide", "D": "Intravenous metoprolol", "E": "Intravenous normal saline bolus"}, "answer": "E", "why_correct": ["This patient has an inferior STEMI (ST elevation in II, III, and aVF), usually caused by occlusion of the right coronary artery. Two ECG clues point to right ventricular (RV) involvement: ST elevation greater in lead III than in lead II, and ST elevation in V1. RV infarction accompanies roughly 30%&#8211;50% of inferior MIs.", "An infarcted RV cannot generate much pressure, so it depends on high filling pressure (preload) to push blood through the lungs to the left ventricle. Nitroglycerin is a venodilator; it drops preload, and left ventricular filling and cardiac output collapse. The result is the classic triad of RV infarction: <b>hypotension, elevated jugular venous pressure, and clear lungs<\/b>.", "The fix is to restore preload: stop nitrates and give an IV isotonic crystalloid bolus while the patient goes for emergent PCI, which is the definitive therapy. Right-sided precordial leads (ST elevation &#8805;1 mm in V4R) confirm the diagnosis."], "why_wrong": {"A": "Dobutamine is the inotrope of choice for RV infarction, but only when hypotension persists after adequate volume loading. Fluids come first.", "B": "An IABP lowers left ventricular afterload and augments coronary diastolic perfusion; it does not fix an RV preload problem. The IABP-SHOCK II trial also showed no mortality benefit from routine IABP use in MI complicated by cardiogenic shock.", "C": "Furosemide reduces preload further and would worsen the hypotension. The lungs are clear, so there is no pulmonary edema to treat.", "D": "Beta-blockers are contraindicated in patients with hypotension, signs of a low-output state, or increased risk of cardiogenic shock. IV metoprolol here could precipitate shock."}, "objective": "In inferior STEMI, hypotension after nitrates with elevated JVP and clear lungs means RV infarction. Treat with IV fluids and urgent reperfusion, and avoid preload-reducing drugs (nitrates, diuretics, morphine).", "sources": ["O'Gara PT, et al. 2013 ACCF/AHA Guideline for the Management of ST-Elevation Myocardial Infarction. Circulation. 2013;127:e362&#8211;e425 (RV infarction section).", "Rao SV, et al. 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Patients With Acute Coronary Syndromes. Circulation. 2025.", "Thiele H, et al. Intraaortic balloon support for myocardial infarction with cardiogenic shock (IABP-SHOCK II). N Engl J Med. 2012;367:1287&#8211;1296."]}, {"id": "B1-Q02", "sys": "OB/GYN", "discipline": "Obstetrics & Gynecology", "topic": "Tubal ectopic pregnancy with a contraindication to methotrexate (breastfeeding)", "difficulty": 4, "vignette": ["A 31-year-old woman, gravida 3, para 2, comes to the emergency department because of 2 days of vaginal spotting and intermittent left lower abdominal cramping. Her last menstrual period was 7 weeks ago. She delivered her second child vaginally 10 months ago and continues to breastfeed several times daily. She was treated for chlamydial cervicitis 6 years ago. Her only medication is a prenatal vitamin.", "Temperature is 36.8 C (98.2 F), blood pressure is 118/74 mm Hg, pulse is 82/min, and respirations are 14/min. The abdomen is soft, with mild left lower quadrant tenderness and no rebound or guarding. Pelvic examination shows a small amount of dark blood in the vaginal vault, a closed cervical os, and mild left adnexal tenderness. Transvaginal ultrasonography shows no intrauterine gestational sac and a 2.4-cm left adnexal mass, separate from the ovary, that contains a yolk sac without embryonic cardiac activity. There is no free fluid in the pelvis."], "labs": [["&#946;-hCG", "2,600 mIU/mL"], ["Hemoglobin", "12.6 g/dL"], ["Leukocytes", "7,200/&#181;L"], ["Platelets", "245,000/&#181;L"], ["Creatinine", "0.7 mg/dL"], ["AST", "22 U/L"], ["ALT", "18 U/L"], ["Blood type", "O, Rh-positive"]], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Dilation and curettage", "B": "Intramuscular methotrexate", "C": "Laparoscopic salpingectomy or salpingostomy", "D": "Mifepristone followed by misoprostol", "E": "Repeat &#946;-hCG measurement in 48 hours"}, "answer": "C", "why_correct": ["An extrauterine gestational sac containing a yolk sac, with no intrauterine pregnancy, confirms a tubal ectopic pregnancy. She is hemodynamically stable, the mass is small (2.4 cm), &#946;-hCG is below 5,000 mIU/mL, there is no cardiac activity, and there is no sign of rupture. On paper she is an ideal methotrexate candidate, except for one detail: <b>she is breastfeeding<\/b>.", "ACOG lists current breastfeeding as an <b>absolute contraindication<\/b> to methotrexate, because the drug passes into breast milk and can harm the infant. A hemodynamically stable patient who cannot receive methotrexate is treated surgically, usually by laparoscopy with salpingectomy (removing the tube) or salpingostomy (removing the pregnancy and preserving the tube). Because she is Rh-positive, anti-D immune globulin is not needed.", "Other absolute contraindications worth memorizing: intrauterine pregnancy, immunodeficiency, moderate to severe anemia, leukopenia, or thrombocytopenia, methotrexate sensitivity, active pulmonary disease, active peptic ulcer disease, clinically significant hepatic or renal dysfunction, and ruptured ectopic pregnancy or hemodynamic instability. Relative contraindications include embryonic cardiac activity, &#946;-hCG above 5,000 mIU/mL, a large mass (often cited as greater than 3.5&#8211;4 cm), refusal of blood transfusion, and inability to follow up."], "why_wrong": {"A": "D&amp;C helps distinguish a failed intrauterine pregnancy from an ectopic pregnancy when the pregnancy location is unknown. Here the ectopic pregnancy is already visualized, and D&amp;C would not treat it.", "B": "She meets the size and &#946;-hCG criteria, but breastfeeding is an absolute contraindication to methotrexate.", "D": "Mifepristone followed by misoprostol is used for medication abortion or early loss of an <i>intrauterine<\/i> pregnancy. It does not treat a tubal pregnancy and would delay definitive care.", "E": "Serial &#946;-hCG measurement is used for a pregnancy of unknown location. Expectant management of a known ectopic pregnancy is reserved for asymptomatic patients with low and declining &#946;-hCG; she is symptomatic, and the diagnosis is already established."}, "objective": "Breastfeeding is an absolute contraindication to methotrexate for ectopic pregnancy. Stable patients who cannot receive methotrexate are managed with laparoscopic surgery.", "sources": ["American College of Obstetricians and Gynecologists. ACOG Practice Bulletin No. 193: Tubal Ectopic Pregnancy. Obstet Gynecol. 2018;131(3):e91&#8211;e103."]}, {"id": "B1-Q03", "sys": "Endocrine", "discipline": "Internal Medicine", "topic": "Diabetic ketoacidosis with hypokalemia: replete potassium before insulin", "difficulty": 4, "vignette": ["A 22-year-old woman with type 1 diabetes mellitus is brought to the emergency department because of 2 days of nausea, vomiting, and diffuse abdominal pain. She ran out of insulin 4 days ago after losing her health insurance. She reports increased thirst and urination.", "Temperature is 37.2 C (99 F), blood pressure is 98/62 mm Hg, pulse is 118/min, and respirations are 30/min and deep. She is drowsy but oriented. Mucous membranes are dry, and her breath has a fruity odor. The abdomen is diffusely tender without rebound or guarding. ECG shows sinus tachycardia with prominent U waves. An infusion of isotonic crystalloid is started at 1 L/h."], "labs": [["Sodium", "132 mEq/L"], ["Potassium", "2.9 mEq/L"], ["Chloride", "96 mEq/L"], ["Bicarbonate", "7 mEq/L"], ["Blood urea nitrogen", "32 mg/dL"], ["Creatinine", "1.4 mg/dL"], ["Glucose", "486 mg/dL"], ["&#946;-hydroxybutyrate", "7.8 mmol/L"], ["Venous pH", "7.06"]], "after_labs": [], "stem": "In addition to continued intravenous fluids, which of the following is the most appropriate next step in management?", "options": {"A": "Addition of 5% dextrose to the intravenous fluids", "B": "Intravenous insulin infusion", "C": "Intravenous insulin infusion plus intravenous potassium chloride", "D": "Intravenous potassium chloride, with insulin withheld", "E": "Intravenous sodium bicarbonate"}, "answer": "D", "why_correct": ["This is severe DKA: glucose 486 mg/dL, &#946;-hydroxybutyrate 7.8 mmol/L, bicarbonate 7 mEq/L, and an anion gap of 29 (132 &#8722; [96 + 7]). She needs insulin, but not yet.", "Insulin drives potassium into cells by stimulating Na<sup>+<\/sup>/K<sup>+<\/sup>-ATPase. Patients in DKA have a large total-body potassium deficit from osmotic diuresis, vomiting, and volume-driven aldosterone release. Insulin deficiency, hyperosmolality, and acidosis shift potassium <i>out<\/i> of cells, so the serum level is usually normal or high at presentation. A <b>low<\/b> serum potassium at presentation (2.9 mEq/L, with U waves) therefore signals a profound deficit, and starting insulin now could cause life-threatening hypokalemia, arrhythmias, and respiratory muscle weakness.", "The 2024 ADA/EASD/JBDS/AACE/DTS consensus report recommends starting potassium replacement and <b>postponing insulin until serum potassium is above 3.5 mEq/L<\/b>. (The older 2009 statement used 3.3 mEq/L; at 2.9 mEq/L the answer is the same under either.) Once potassium is above 3.5, start the insulin infusion and add potassium to the fluids to keep it in the normal range."], "why_wrong": {"A": "Dextrose is added once glucose falls to roughly 200&#8211;250 mg/dL, so the insulin infusion can keep clearing ketones without causing hypoglycemia. At 486 mg/dL it is not yet needed.", "B": "Insulin alone would push potassium further into cells and could precipitate a fatal arrhythmia.", "C": "The most tempting distractor. Giving insulin together with potassium is correct when potassium is 3.5 mEq/L or higher, but below 3.5 the consensus recommends postponing insulin until potassium has been repleted.", "E": "The 2024 consensus recommends bicarbonate only if pH is below 7.0. Her pH is 7.06, and bicarbonate would also shift potassium into cells and worsen her hypokalemia."}, "objective": "Always check potassium before starting insulin in DKA. If K<sup>+<\/sup> is below 3.5 mEq/L, replace potassium first and hold insulin until K<sup>+<\/sup> is above 3.5 mEq/L.", "sources": ["Umpierrez GE, et al. Hyperglycemic Crises in Adults With Diabetes: A Consensus Report. Diabetes Care. 2024;47(8):1257&#8211;1275 (also published in Diabetologia. 2024;67:1455&#8211;1479)."]}, {"id": "B1-Q04", "sys": "Gastrointestinal", "discipline": "Pediatrics / Surgery", "topic": "Neonatal bilious emesis: rule out malrotation with midgut volvulus", "difficulty": 3, "vignette": ["A 3-day-old boy in the newborn nursery has had 3 episodes of forceful, bright green emesis over the past 3 hours. He was born at 39 weeks' gestation by uncomplicated vaginal delivery to a 28-year-old woman whose prenatal course, including fetal ultrasonography, was normal. Birth weight was 3.4 kg (7.5 lb). He passed meconium within 24 hours of birth and had been breastfeeding well.", "Temperature is 37.0 C (98.6 F), pulse is 158/min, respirations are 44/min, and blood pressure is 72/46 mm Hg. He is alert and cries vigorously. The abdomen is soft and nondistended, with no tenderness or masses. The anus is normally positioned, and there is yellow stool in the diaper. A nasogastric tube is placed and returns bilious fluid. Abdominal x-ray shows a normal bowel gas pattern with gas in the rectum, no dilated loops, and no free air."], "labs": [], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Abdominal ultrasonography of the pylorus", "B": "Contrast enema", "C": "Rectal suction biopsy", "D": "Reassurance and continued breastfeeding", "E": "Upper gastrointestinal contrast series"}, "answer": "E", "why_correct": ["Bilious vomiting in a neonate is a surgical emergency, and <b>malrotation with midgut volvulus<\/b> must be ruled out first. Volvulus can strangle the superior mesenteric artery and cause necrosis of the entire midgut within hours.", "The trap is the reassuring picture: a vigorous infant, a soft abdomen, stool in the diaper, and a normal x-ray. Early volvulus often looks exactly like this, because the obstruction is proximal and the distal bowel has not yet emptied. A normal x-ray does not rule it out.", "In a hemodynamically stable infant, the <b>upper GI contrast series<\/b> is the diagnostic study of choice. It shows an abnormally positioned duodenojejunal junction (malrotation) or a &#8220;corkscrew&#8221; duodenum (volvulus). While it is arranged, the infant is kept NPO with nasogastric decompression and IV fluids, and pediatric surgery is consulted. Infants with peritonitis or shock skip imaging and go straight to laparotomy (Ladd procedure).", "Pearl: duodenal atresia also causes bilious vomiting, usually on day 1, but its x-ray shows a &#8220;double bubble&#8221; with no distal gas. This infant has rectal gas."], "why_wrong": {"A": "Pyloric stenosis presents at about 3&#8211;6 weeks of age with <i>nonbilious<\/i> projectile vomiting, because the obstruction is proximal to the ampulla of Vater.", "B": "A contrast enema evaluates distal obstruction (Hirschsprung disease, meconium plug, meconium ileus), which presents with failure to pass meconium and abdominal distension. This infant passed meconium and is not distended.", "C": "Rectal suction biopsy diagnoses Hirschsprung disease (absent ganglion cells), which classically presents with delayed passage of meconium beyond 48 hours and distension.", "D": "Bilious emesis is never normal in a newborn. Reassurance risks missing a volvulus until the bowel is dead."}, "objective": "Bilious vomiting in a neonate is malrotation with midgut volvulus until proven otherwise. Stable infants get an emergent upper GI series; unstable infants or those with peritonitis go directly to surgery.", "sources": ["American College of Radiology. ACR Appropriateness Criteria: Vomiting in Infants.", "Sizemore AW, et al. Diagnostic performance of the upper GI series in children with suspected malrotation. Pediatr Radiol (UGI sensitivity about 96% for surgically confirmed malrotation)."]}, {"id": "B1-Q05", "sys": "Toxicology", "discipline": "Emergency Medicine", "topic": "Acetaminophen overdose with unknown ingestion time", "difficulty": 4, "vignette": ["A 24-year-old woman is brought to the emergency department by her roommate, who returned from a weekend away and found her in her bedroom with an empty bottle of extra-strength acetaminophen (500-mg tablets) and a note apologizing to her family. The patient says she took &#8220;a lot of pills&#8221; but is unsure when; she thinks it was &#8220;sometime yesterday or the day before.&#8221; She reports nausea and right upper abdominal discomfort. She takes no other medications and denies other ingestions.", "Temperature is 37.0 C (98.6 F), blood pressure is 116/72 mm Hg, pulse is 96/min, and respirations are 16/min. She is alert, oriented, and tearful. There is mild right upper quadrant tenderness. There is no jaundice or asterixis."], "labs": [["Acetaminophen", "34 &#181;g/mL"], ["Salicylate", "Undetectable"], ["Ethanol", "Undetectable"], ["AST", "486 U/L"], ["ALT", "612 U/L"], ["Total bilirubin", "1.4 mg/dL"], ["International normalized ratio", "1.5"], ["Creatinine", "0.8 mg/dL"], ["Venous pH", "7.38"], ["Lactate", "1.6 mmol/L"]], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Activated charcoal", "B": "Hemodialysis", "C": "Intravenous N-acetylcysteine", "D": "Referral for liver transplant evaluation", "E": "Repeat acetaminophen level in 4 hours and plot on the Rumack-Matthew nomogram"}, "answer": "C", "why_correct": ["The Rumack-Matthew nomogram works only for a <b>single acute ingestion with a known time of ingestion<\/b>, using a level drawn 4&#8211;24 hours afterward. This patient cannot say when she took the pills, so the nomogram cannot be used. She also already has a detectable acetaminophen level and elevated aminotransferases, meaning liver injury is underway.", "The 2023 US/Canadian consensus statement recommends starting N-acetylcysteine (NAC) immediately when the time of ingestion is unknown and the acetaminophen concentration is detectable or aminotransferases are elevated. NAC replenishes glutathione, which detoxifies the toxic metabolite NAPQI. It is most protective within 8 hours of ingestion, but it still improves outcomes when started late, including after liver injury has begun. Treatment continues until acetaminophen is undetectable and liver tests and INR are improving.", "Because this was an intentional overdose with a suicide note, she also needs continuous observation and psychiatric evaluation once she is medically stable."], "why_wrong": {"A": "Activated charcoal helps when given within about 4 hours of ingestion. Her ingestion was likely more than a day ago, so charcoal offers no benefit and adds aspiration risk.", "B": "Extracorporeal removal is reserved for massive ingestions with extremely high acetaminophen concentrations plus altered mental status and metabolic acidosis. She has a modest level, normal mentation, and normal pH and lactate.", "D": "She does not meet King's College criteria for transplant referral in acetaminophen-induced liver failure: arterial pH below 7.30 after resuscitation, <i>or<\/i> all of INR above 6.5, creatinine above 3.4 mg/dL, and grade III or IV encephalopathy.", "E": "Waiting 4 hours delays the antidote while liver injury progresses, and a second level still cannot be plotted without a known ingestion time."}, "objective": "The Rumack-Matthew nomogram applies only to a single acute ingestion with a known time. If the time is unknown and acetaminophen is detectable or AST/ALT is elevated, start NAC immediately.", "sources": ["Dart RC, et al. Management of Acetaminophen Poisoning in the US and Canada: A Consensus Statement. JAMA Netw Open. 2023;6(8):e2327739.", "O'Grady JG, et al. Early indicators of prognosis in fulminant hepatic failure. Gastroenterology. 1989;97:439&#8211;445 (King's College criteria)."]}, {"id": "B1-Q06", "sys": "Hematology", "discipline": "Internal Medicine", "topic": "Heparin-induced thrombocytopenia with thrombosis", "difficulty": 4, "vignette": ["A 72-year-old woman is hospitalized for community-acquired pneumonia. On admission, she was started on ceftriaxone, azithromycin, and subcutaneous unfractionated heparin 5,000 units every 8 hours for venous thromboembolism prophylaxis. Her fever and oxygen requirement have improved. On hospital day 7, she reports new pain and swelling in her right calf.", "Vital signs are within normal limits. The right calf is 3 cm larger in circumference than the left and is tender. There is no bleeding from any site. Duplex ultrasonography shows an occlusive thrombus in the right popliteal vein. A peripheral blood smear shows no schistocytes. A platelet factor 4 (PF4)&#8211;heparin immunoassay is sent."], "labs": [["Platelets, admission", "248,000/&#181;L"], ["Platelets, hospital day 7", "92,000/&#181;L"], ["Hemoglobin", "12.1 g/dL"], ["International normalized ratio", "1.1"], ["Activated PTT", "30 sec"], ["Creatinine", "0.9 mg/dL"], ["AST / ALT", "24 U/L / 20 U/L"]], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Discontinue heparin and await immunoassay results", "B": "Discontinue heparin and begin argatroban", "C": "Discontinue heparin and begin enoxaparin", "D": "Discontinue heparin and begin warfarin", "E": "Platelet transfusion"}, "answer": "B", "why_correct": ["This is heparin-induced thrombocytopenia (HIT): IgG antibodies against PF4&#8211;heparin complexes activate platelets, causing thrombocytopenia and a strongly <b>prothrombotic<\/b> state. Her 4Ts score is high: platelets fell 63% with a nadir above 20,000/&#181;L (2 points), the fall began on day 7 of heparin (2 points), and she has a new DVT (2 points). The antibiotics are a possible alternative cause (1 point), for a total of 7 of 8.", "With an intermediate or high 4Ts score, ASH recommends <b>stopping all heparin (including flushes) and immediately starting a non-heparin anticoagulant<\/b> at therapeutic intensity, without waiting for lab confirmation. Options include argatroban, bivalirudin, fondaparinux, or a DOAC. Argatroban is hepatically cleared, which makes it a good choice here and in renal failure. Because she has HIT with thrombosis, therapeutic dosing is required."], "why_wrong": {"A": "Stopping heparin without starting another anticoagulant leaves her at high risk of new thrombosis, and she already has a DVT that needs treatment. The immunoassay guides later decisions; it does not delay treatment when the 4Ts score is high.", "C": "Low-molecular-weight heparin cross-reacts with HIT antibodies, so enoxaparin is contraindicated in acute HIT.", "D": "Starting warfarin during acute HIT rapidly depletes protein C and can cause venous limb gangrene. ASH recommends against starting warfarin before platelet recovery (at least 150,000/&#181;L) and favors transitioning to a DOAC rather than warfarin.", "E": "HIT is a clotting disorder, and bleeding is uncommon. Platelet transfusion is generally avoided unless there is active bleeding or a high-bleeding-risk procedure."}, "objective": "With an intermediate or high 4Ts score, stop all heparin and immediately start a non-heparin anticoagulant (argatroban, bivalirudin, fondaparinux, or a DOAC). Avoid LMWH, avoid warfarin until platelets recover, and avoid prophylactic platelet transfusion.", "sources": ["Cuker A, et al. American Society of Hematology 2018 guidelines for management of venous thromboembolism: heparin-induced thrombocytopenia. Blood Adv. 2018;2(22):3360&#8211;3392."]}, {"id": "B1-Q07", "sys": "Infectious disease", "discipline": "Emergency Medicine", "topic": "Bacterial meningitis needing CT before LP: treat before imaging; add ampicillin after age 50", "difficulty": 4, "vignette": ["A 61-year-old woman is brought to the emergency department by her husband because of fever, severe headache, and increasing confusion that began 18 hours ago. She had right ear pain for several days last week. While in triage, she has a generalized tonic-clonic seizure that stops spontaneously after 2 minutes. Her only medical condition is hypothyroidism, treated with levothyroxine.", "Temperature is 39.6 C (103.3 F), blood pressure is 138/84 mm Hg, pulse is 116/min, respirations are 22/min, and pulse oximetry shows 95% on room air. She is postictal; she opens her eyes to voice but does not consistently follow commands. Passive neck flexion is resisted and painful. The right tympanic membrane is erythematous and bulging. There is no rash. She moves all extremities."], "labs": [["Leukocytes", "21,400/&#181;L"], ["Neutrophils", "90%"], ["Glucose", "112 mg/dL"], ["Creatinine", "0.8 mg/dL"]], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Blood cultures, then IV dexamethasone, vancomycin, ceftriaxone, and ampicillin, then CT of the head", "B": "Blood cultures, then IV vancomycin and ceftriaxone, then CT of the head", "C": "CT of the head, then lumbar puncture, then antibiotics based on CSF findings", "D": "Immediate lumbar puncture, then empiric antibiotics", "E": "Intravenous acyclovir, then MRI of the brain"}, "answer": "A", "why_correct": ["Fever, headache, neck stiffness, and altered mental status after a recent otitis media point to acute bacterial meningitis, most likely <i>Streptococcus pneumoniae<\/i> spreading from the middle ear.", "She needs a head CT before lumbar puncture because she had a <b>new-onset seizure<\/b> and has an <b>abnormal level of consciousness<\/b>. (IDSA criteria for CT before LP: immunocompromise, history of CNS disease, new-onset seizure, papilledema, abnormal level of consciousness, or focal neurologic deficit.) But imaging must never delay treatment: draw blood cultures, give dexamethasone and empiric antibiotics, then obtain the CT, then perform the LP if it is safe.", "Empiric therapy for adults older than 50 is vancomycin plus a third-generation cephalosporin (ceftriaxone or cefotaxime), <b>plus ampicillin for <i>Listeria monocytogenes<\/i><\/b>. Dexamethasone (0.15 mg/kg every 6 hours for 2&#8211;4 days) reduces unfavorable outcomes and death in adults with pneumococcal meningitis and should be given 10&#8211;20 minutes before, or together with, the first antibiotic dose."], "why_wrong": {"B": "Close, but it misses two things. Without ampicillin, <i>Listeria<\/i> (a major pathogen after age 50) is uncovered. And dexamethasone must be given with or before the first antibiotic dose; IDSA advises against starting it in adults who have already received antibiotics.", "C": "CT before LP is the right order, but antibiotics must not wait for either. Delaying antibiotics in bacterial meningitis increases mortality.", "D": "A new seizure and depressed consciousness raise concern for elevated intracranial pressure or a mass lesion (such as a brain abscess from otitis), so LP before CT risks herniation. It also delays antibiotics.", "E": "Acyclovir can be added when HSV encephalitis is a concern, but acyclovir alone leaves bacterial meningitis untreated, and MRI would delay care."}, "objective": "In suspected bacterial meningitis with an indication for CT before LP, the order is blood cultures, then dexamethasone plus empiric antibiotics, then CT, then LP. After age 50, add ampicillin for Listeria.", "sources": ["Tunkel AR, et al. Practice Guidelines for the Management of Bacterial Meningitis. Clin Infect Dis. 2004;39(9):1267&#8211;1284.", "de Gans J, van de Beek D. Dexamethasone in adults with bacterial meningitis. N Engl J Med. 2002;347:1549&#8211;1556."]}, {"id": "B1-Q08", "sys": "Renal", "discipline": "Internal Medicine", "topic": "Hyponatremia overcorrection in a patient at high risk for osmotic demyelination", "difficulty": 5, "vignette": ["A 54-year-old man is brought to the emergency department by his sister because of 3 days of progressive confusion, unsteady gait, and generalized weakness. He has alcohol use disorder and has been drinking about 18 cans of beer daily for the past 2 weeks while eating very little. He has no other medical conditions and takes no medications.", "Temperature is 36.7 C (98.1 F), blood pressure is 128/80 mm Hg, pulse is 92/min, and respirations are 16/min. He is thin and oriented to person only. Mucous membranes are moist, and there is no edema or asterixis. Neurologic examination is nonfocal, and there is no seizure activity. Admission laboratory results are as follows:"], "labs": [["Sodium", "107 mEq/L"], ["Potassium", "2.8 mEq/L"], ["Chloride", "72 mEq/L"], ["Bicarbonate", "22 mEq/L"], ["Blood urea nitrogen", "3 mg/dL"], ["Creatinine", "0.6 mg/dL"], ["Glucose", "84 mg/dL"], ["Serum osmolality", "222 mOsm/kg"], ["Ethanol", "Undetectable"], ["Urine osmolality", "70 mOsm/kg"], ["Urine sodium", "&lt;10 mEq/L"]], "after_labs": ["He is admitted to the intensive care unit and treated with intravenous thiamine, potassium chloride (80 mEq over 8 hours), and 0.9% saline. Over the next 8 hours, he produces 3.6 L of dilute urine. Repeat serum sodium is 117 mEq/L. He is now oriented to person and place."], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "3% hypertonic saline", "B": "Continue current therapy and recheck sodium in 4 hours", "C": "Fluid restriction to 1 L/day", "D": "Intravenous desmopressin and 5% dextrose in water", "E": "Oral tolvaptan"}, "answer": "D", "why_correct": ["This is <b>beer potomania<\/b> (low-solute hyponatremia). The kidneys need solute to excrete water. With almost no food and only beer, his solute intake is so low that he cannot excrete the water he drinks, even though ADH is appropriately suppressed (urine osmolality 70 mOsm/kg).", "Once solute arrives (saline, potassium, and soon food), the kidneys suddenly excrete large volumes of dilute urine, and serum sodium rises fast and unpredictably. Potassium repletion raises serum sodium too, because exchangeable potassium counts toward serum sodium concentration. His sodium has already risen 10 mEq/L in 8 hours, and the water diuresis is ongoing.", "He is at <b>high risk for osmotic demyelination syndrome (ODS)<\/b>: alcohol use disorder, malnutrition, hypokalemia, and a starting sodium near 105. In high-risk patients the goal is a rise of 4&#8211;6 mEq/L per day, and the rise should not exceed 8 mEq/L in any 24-hour period. He has already passed that limit, so the next step is <b>therapeutic relowering<\/b>: desmopressin to stop the free-water loss plus electrolyte-free water (D5W) to bring sodium back below the limit.", "Do not be reassured by his improved mental status. ODS symptoms (dysarthria, dysphagia, quadriparesis, &#8220;locked-in&#8221; syndrome) typically appear 2&#8211;6 days after overly rapid correction."], "why_wrong": {"A": "Hypertonic saline is for severe symptoms (seizures, coma, respiratory distress) or acute hyponatremia. He is improving and has already corrected too fast.", "B": "With an ongoing water diuresis, sodium will keep climbing; rechecking in 4 hours just documents a larger overcorrection. Continuing saline adds more solute.", "C": "Fluid restriction is part of long-term management, but right now it would accelerate the rise in sodium.", "E": "Tolvaptan is a vasopressin V<sub>2<\/sub> receptor antagonist that increases free-water excretion, the opposite of what is needed. It would raise sodium even faster."}, "objective": "In patients at high risk for ODS (alcohol use disorder, malnutrition, hypokalemia, liver disease, sodium &#8804;105 mEq/L), do not exceed a sodium rise of 8 mEq/L in 24 hours. If a sudden water diuresis overshoots the limit, relower sodium with desmopressin plus D5W.", "sources": ["Verbalis JG, et al. Diagnosis, evaluation, and treatment of hyponatremia: expert panel recommendations. Am J Med. 2013;126(10 Suppl 1):S1&#8211;S42.", "Spasovski G, et al. Clinical practice guideline on diagnosis and treatment of hyponatraemia. Eur J Endocrinol. 2014;170(3):G1&#8211;G47.", "Rondon-Berrios H, et al. Review of therapeutic plasma sodium relowering after overly rapid correction of hyponatremia. Clin J Am Soc Nephrol. 2020."]}, {"id": "B2-Q01", "sys": "Psychiatry", "discipline": "Psychiatry / Internal Medicine", "topic": "Refeeding syndrome during treatment of anorexia nervosa", "difficulty": 4, "vignette": ["A 19-year-old woman with anorexia nervosa is admitted for nutritional rehabilitation after losing 14 kg (31 lb) over 6 months. Her body mass index is 14.1 kg/m<sup>2<\/sup>. On admission, blood pressure is 88/56 mm Hg, pulse is 46/min, and temperature is 35.8 C (96.4 F). She receives oral thiamine and a multivitamin, and a meal-based refeeding plan is started with daily increases in calories. Admission laboratory results are listed below.", "On hospital day 3, she develops swelling of both legs, generalized weakness, and confusion. Pulse is 118/min and respirations are 24/min. Crackles are heard at both lung bases. ECG shows sinus tachycardia with a corrected QT interval of 510 msec."], "labs": [["", "<b>Admission<\/b> / <b>Day 3<\/b>"], ["Sodium", "138 / 134 mEq/L"], ["Potassium", "3.6 / 2.9 mEq/L"], ["Phosphorus", "3.2 / 1.1 mg/dL"], ["Magnesium", "1.8 / 1.3 mg/dL"], ["Glucose", "68 / 142 mg/dL"], ["Creatinine", "0.5 / 0.5 mg/dL"]], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Administer intravenous furosemide for the edema", "B": "Begin intravenous phosphate, potassium, and magnesium replacement and slow the caloric advancement", "C": "Increase caloric intake to correct her malnutrition faster", "D": "Start a continuous insulin infusion for hyperglycemia", "E": "Switch to parenteral nutrition"}, "answer": "B", "why_correct": ["This is <b>refeeding syndrome<\/b>. After prolonged starvation, reintroducing carbohydrate triggers insulin release, which drives phosphate, potassium, and magnesium into cells and consumes thiamine. The result is hypophosphatemia (ATP depletion: weakness, confusion, respiratory and cardiac dysfunction), hypokalemia and hypomagnesemia (arrhythmia, QT prolongation), and insulin-driven sodium and water retention (edema).", "The 2020 ASPEN consensus defines refeeding syndrome as a fall in phosphorus, potassium, or magnesium within 5 days of restarting calories, graded mild (10%&#8211;20% drop), moderate (20%&#8211;30%), or severe (more than 30% or organ dysfunction). Her phosphorus fell 66% and she has edema, confusion, and a prolonged QT: this is severe.", "Treatment is to replace the electrolytes intravenously with cardiac monitoring, continue thiamine (typically 100 mg daily before and during the first days of refeeding), and slow or temporarily reduce the caloric advancement until the electrolytes are stable, then resume with daily monitoring. Nutrition is not stopped altogether; the goal is a controlled pace."], "why_wrong": {"A": "The edema comes from insulin-mediated sodium retention, and she is already hypovolemic and bradycardic. Furosemide would worsen her hypokalemia and hypomagnesemia.", "C": "Pushing calories faster accelerates the intracellular shifts that are causing the problem. This is the most dangerous choice.", "D": "Insulin would drive even more phosphate and potassium into cells. Mild refeeding hyperglycemia is treated by slowing carbohydrate delivery, not with an insulin drip.", "E": "The route is not the problem, and parenteral nutrition carries a higher refeeding risk than enteral or oral feeding."}, "objective": "Falling phosphorus, potassium, or magnesium within 5 days of restarting nutrition in a malnourished patient is refeeding syndrome. Replace electrolytes, give thiamine, and slow the caloric advancement; never speed it up.", "sources": ["da Silva JSV, et al. ASPEN Consensus Recommendations for Refeeding Syndrome. Nutr Clin Pract. 2020;35(2):178&#8211;195."]}, {"id": "B2-Q02", "sys": "Surgery", "discipline": "General Surgery", "topic": "Sigmoid volvulus after successful endoscopic detorsion: resect during the same admission", "difficulty": 5, "vignette": ["An 81-year-old man is brought from his nursing facility because of 2 days of abdominal distension, crampy pain, and no passage of stool or flatus. He has Parkinson disease and chronic constipation. Temperature is 37.1 C (98.8 F), blood pressure is 134/78 mm Hg, and pulse is 92/min. The abdomen is markedly distended and tympanitic, with mild diffuse tenderness and no rebound or guarding. Leukocyte count is 9,800/&#181;L and serum lactate is 1.4 mmol/L. Abdominal x-ray shows a massively dilated, ahaustral loop of colon arising from the pelvis and extending to the right upper quadrant. CT shows a swirl of mesenteric vessels at the sigmoid colon, normal bowel wall enhancement, and no free air.", "He undergoes flexible sigmoidoscopy with successful detorsion and decompression; the mucosa appears viable, and a rectal tube is left in place. Over the next 48 hours he passes flatus and stool, the abdomen becomes soft and nondistended, and he tolerates a regular diet. The anesthesiologist considers him an acceptable, though higher-risk, operative candidate."], "labs": [], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Discharge to the nursing facility with outpatient colonoscopy in 6 weeks", "B": "Percutaneous endoscopic colostomy", "C": "Repeat flexible sigmoidoscopy before discharge", "D": "Sigmoid colectomy during this hospitalization", "E": "Sigmoidopexy (surgical fixation of the sigmoid colon without resection)"}, "answer": "D", "why_correct": ["A redundant sigmoid colon on a long, narrow mesentery twists on itself, producing a closed-loop obstruction. The classic patient is elderly, institutionalized, chronically constipated, and often on medications that slow the bowel. The x-ray shows the <b>coffee-bean sign<\/b>, and the CT shows the mesenteric <b>whirl sign<\/b>.", "In a stable patient without peritonitis or perforation, the first step is endoscopic detorsion and decompression, which also lets the endoscopist inspect the mucosa for ischemia. That was done correctly here. The trap is to stop there: recurrence after detorsion alone is very high (commonly cited at 40%&#8211;60% or more), and each recurrence carries more risk of necrosis and death.", "The 2021 ASCRS guideline recommends that patients who undergo successful endoscopic detorsion be considered for <b>sigmoid colectomy during the same hospital admission<\/b> to prevent recurrence. Resection with primary anastomosis is usual in a prepared, stable patient; nonresectional operations are inferior. Urgent resection without a prior endoscopic attempt is reserved for failed detorsion, nonviable bowel, or perforation."], "why_wrong": {"A": "Discharge after detorsion alone invites recurrence, often within days to weeks, in a frail patient who tolerated one episode. Colonoscopy in 6 weeks does nothing to prevent the next twist.", "B": "Percutaneous endoscopic colostomy (endoscopic fixation) is an option only for patients whose operative risk is prohibitive. He is an acceptable candidate.", "C": "Repeating the sigmoidoscopy adds information only if there is concern for ischemia; it does not treat the underlying redundant sigmoid.", "E": "Sigmoidopexy, detorsion alone, and mesosigmoidoplasty all have higher recurrence rates than resection, so the guideline recommends colectomy instead."}, "objective": "Sigmoid volvulus in a stable patient: endoscopic detorsion first, then sigmoid colectomy during the same admission. Cecal volvulus skips endoscopy and goes straight to right colectomy.", "sources": ["Alavi K, et al. The American Society of Colon and Rectal Surgeons Clinical Practice Guidelines for the Management of Colonic Volvulus and Acute Colonic Pseudo-Obstruction. Dis Colon Rectum. 2021;64(9):1046&#8211;1057."]}, {"id": "B2-Q03", "sys": "Respiratory", "discipline": "Internal Medicine", "topic": "Complicated parapneumonic effusion: drain it", "difficulty": 4, "vignette": ["A 58-year-old man with alcohol use disorder was admitted 3 days ago with right lower lobe community-acquired pneumonia and has been receiving intravenous ceftriaxone and azithromycin. After initial improvement, he now has recurrent fever to 39.0 C (102.2 F), right-sided pleuritic chest pain, and worsening dyspnea. Pulse is 104/min, respirations are 24/min, and pulse oximetry shows 92% on room air. Breath sounds are decreased at the right base with dullness to percussion.", "Chest x-ray shows a right pleural effusion occupying about 40% of the hemithorax that layers freely on a lateral decubitus film. Ultrasound-guided thoracentesis yields cloudy yellow fluid without frank pus."], "labs": [["Pleural fluid pH", "7.08"], ["Pleural fluid glucose", "32 mg/dL"], ["Pleural fluid LDH", "1,860 U/L"], ["Pleural fluid protein", "4.6 g/dL"], ["Pleural fluid leukocytes", "28,000/&#181;L (90% neutrophils)"], ["Pleural fluid Gram stain", "No organisms"], ["Serum LDH", "210 U/L"], ["Serum protein", "6.4 g/dL"]], "after_labs": [], "stem": "In addition to continuing antibiotics, which of the following is the most appropriate next step in management?", "options": {"A": "Continue current antibiotics and repeat thoracentesis in 48 hours", "B": "Intravenous corticosteroids", "C": "Serial therapeutic thoracenteses", "D": "Surgical decortication by video-assisted thoracoscopy", "E": "Tube thoracostomy drainage"}, "answer": "E", "why_correct": ["The fluid is an exudate by Light's criteria (pleural-to-serum protein ratio 0.72, LDH ratio 8.9, and LDH far above two-thirds of the upper limit of normal). More importantly, it is a <b>complicated parapneumonic effusion<\/b>: pleural fluid pH below 7.20, glucose below 60 mg/dL, and a very high LDH mean bacteria have invaded the pleural space, even though the Gram stain is negative and the fluid is not yet frank pus.", "Pleural fluid pH, measured on a blood-gas analyzer, is the single most useful chemistry. A pH below 7.20 (or glucose below 60 mg/dL), a positive Gram stain or culture, a large effusion (at least half the hemithorax), or loculations place the patient in the ACCP moderate- or high-risk categories, where antibiotics alone fail and <b>drainage<\/b> is required. Untreated, the effusion organizes into empyema and a fibrous peel.", "Drainage means a chest tube, ideally a small-bore tube placed under ultrasound guidance. Antibiotics should also cover anaerobes (for example, adding metronidazole or switching to ampicillin-sulbactam). If the fluid is loculated or drainage is incomplete, intrapleural tPA plus DNase (MIST2) or thoracoscopic drainage is the next escalation."], "why_wrong": {"A": "Waiting lets the fibrinopurulent stage progress to loculation and empyema. The decision to drain is already made by the fluid chemistry.", "B": "Corticosteroids have no role in treating an infected pleural space and may impair host defenses.", "C": "Intermittent taps rarely achieve complete drainage of an infected space; a tube provides continuous drainage and a route for fibrinolytics if needed.", "D": "Surgery is reserved for effusions that fail tube drainage with or without fibrinolytics, or for organized empyema. It is not the first step for a free-flowing effusion."}, "objective": "A parapneumonic effusion with pH below 7.20, glucose below 60 mg/dL, positive Gram stain or culture, loculations, or frank pus needs tube drainage plus antibiotics with anaerobic coverage.", "sources": ["Colice GL, et al. Medical and surgical treatment of parapneumonic effusions: an evidence-based guideline (ACCP). Chest. 2000;118(4):1158&#8211;1171.", "Roberts ME, et al. British Thoracic Society Guideline for pleural disease. Thorax. 2023;78(Suppl 3).", "Rahman NM, et al. Intrapleural use of tissue plasminogen activator and DNase in pleural infection (MIST2). N Engl J Med. 2011;365:518&#8211;526."]}, {"id": "B2-Q04", "sys": "Musculoskeletal", "discipline": "Pediatrics / Orthopedics", "topic": "Septic arthritis of the hip in a child (Kocher criteria)", "difficulty": 4, "vignette": ["A 3-year-old boy is brought to the emergency department because he has refused to walk since waking this morning. He had a runny nose and cough last week that resolved. Temperature is 38.9 C (102 F) and pulse is 128/min. He lies with the right hip flexed, abducted, and externally rotated and cries with any passive motion of the hip. There is no rash or skin lesion. Radiographs of the pelvis and right hip are normal. Hip ultrasonography shows a moderate right hip effusion."], "labs": [["Leukocytes", "15,400/&#181;L"], ["Erythrocyte sedimentation rate", "58 mm/h"], ["C-reactive protein", "4.8 mg/dL"]], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Arthrocentesis of the right hip under ultrasound guidance", "B": "Empiric intravenous cefazolin and reassessment in 24 hours", "C": "Ibuprofen and observation with repeat examination in 24 hours", "D": "MRI of the right hip", "E": "Trial of weight bearing after acetaminophen"}, "answer": "A", "why_correct": ["The question is septic arthritis versus transient synovitis, and the <b>Kocher criteria<\/b> settle it: inability to bear weight, fever above 38.5 C, ESR above 40 mm/h, and leukocyte count above 12,000/&#181;L. He has all four, which predicts septic arthritis in about 99% of cases (three of four predicts about 93%). An elevated CRP (above 2 mg/dL) adds further weight. The preceding viral illness is a red herring that would fit transient synovitis only if he were well-appearing with normal labs.", "Septic arthritis of the hip is an emergency: bacterial enzymes destroy cartilage within days, and pressure in the capsule can cause avascular necrosis of the femoral head. The next step is <b>joint aspiration<\/b>, which confirms the diagnosis (synovial leukocytes typically above 50,000/&#181;L with neutrophil predominance, Gram stain, culture) and should be obtained before antibiotics whenever possible so cultures are not sterilized.", "Aspiration is followed promptly by intravenous antibiotics (covering Staphylococcus aureus and, in children under about 4 years, Kingella kingae) and surgical irrigation and drainage of the hip."], "why_wrong": {"B": "Antibiotics before aspiration lower the culture yield and, more importantly, delay the drainage the joint needs.", "C": "NSAIDs and observation are appropriate for transient synovitis, the diagnosis in a well-appearing, afebrile child with few or no Kocher criteria. Not here.", "D": "MRI helps when adjacent osteomyelitis or an abscess is suspected, but it should never delay aspiration of a joint with this probability of infection.", "E": "A child who meets all four criteria needs the joint drained, not a walking trial."}, "objective": "In a child with an irritable hip, count the Kocher criteria (non-weight-bearing, fever above 38.5 C, ESR above 40, WBC above 12,000). Three or four mean septic arthritis until proven otherwise: aspirate the joint, then antibiotics and surgical drainage.", "sources": ["Kocher MS, Zurakowski D, Kasser JR. Differentiating between septic arthritis and transient synovitis of the hip in children: an evidence-based clinical prediction algorithm. J Bone Joint Surg Am. 1999;81(12):1662&#8211;1670.", "Caird MS, et al. Factors distinguishing septic arthritis from transient synovitis of the hip in children. J Bone Joint Surg Am. 2006;88(6):1251&#8211;1257."]}, {"id": "B2-Q05", "sys": "Dermatology", "discipline": "Dermatology / Surgery", "topic": "Suspected melanoma: narrow excisional biopsy first", "difficulty": 4, "vignette": ["A 46-year-old man comes to the office because his wife noticed that a mole on his upper back has grown and darkened over the past 6 months. He has fair skin, had several blistering sunburns as a child, and has no family history of skin cancer. Examination shows a 9-mm asymmetric, slightly raised lesion with irregular, notched borders and variegated brown and black color with a focal blue-gray area. Dermoscopy shows an atypical pigment network with a blue-white veil. There is no palpable cervical, axillary, or inguinal lymphadenopathy."], "labs": [], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "Excisional biopsy with 1- to 3-mm margins", "B": "Punch biopsy of the darkest area", "C": "Reassurance with photographic follow-up in 3 months", "D": "Superficial shave biopsy", "E": "Wide local excision with 1-cm margins"}, "answer": "A", "why_correct": ["The lesion has every ABCDE feature of melanoma (asymmetry, border irregularity, color variation, diameter above 6 mm, evolution), plus a blue-white veil on dermoscopy. The next step is histologic diagnosis with a technique that captures the whole lesion at full depth.", "The American Academy of Dermatology recommends a <b>narrow excisional (complete) biopsy with 1- to 3-mm margins<\/b>, deep enough to avoid transecting the base. This provides the Breslow thickness, the single most important prognostic factor, along with ulceration and mitotic rate, which together determine the definitive excision margins and whether sentinel lymph node biopsy is offered.", "Definitive treatment comes second: wide excision margins depend on Breslow depth (0.5&#8211;1 cm for melanoma in situ, 1 cm for tumors 1 mm or thinner, 1&#8211;2 cm for 1 to 2 mm, 2 cm for thicker than 2 mm). Sentinel lymph node biopsy is discussed for tumors 0.8 mm or thicker or any ulcerated tumor, and it is performed before or in the same operation as the wide excision."], "why_wrong": {"B": "A punch samples one part of a 9-mm lesion and can miss the thickest area, understaging the tumor. Partial biopsies are acceptable only for very large lesions or special sites when complete excision is impractical.", "C": "Delay in a lesion with this many melanoma features is never appropriate.", "D": "A superficial shave can transect the base of an invasive melanoma, making the Breslow thickness unmeasurable and compromising staging.", "E": "Margins cannot be chosen before the thickness is known, and a wide excision disturbs lymphatic drainage, which can make later sentinel node mapping unreliable."}, "objective": "For a lesion suspicious for melanoma, do a narrow excisional biopsy with 1- to 3-mm margins first. Breslow thickness from that specimen dictates the wide excision margins and the need for sentinel lymph node biopsy.", "sources": ["Swetter SM, et al. Guidelines of care for the management of primary cutaneous melanoma. J Am Acad Dermatol. 2019;80(1):208&#8211;250."]}, {"id": "B2-Q06", "sys": "Male reproductive", "discipline": "Urology / Surgery", "topic": "Solid testicular mass: radical inguinal orchiectomy", "difficulty": 3, "vignette": ["A 26-year-old man comes to the office because of 2 months of painless enlargement of the left testis with an occasional dull ache. He underwent right orchiopexy for an undescended testis at age 2. Examination shows a 3-cm firm, nontender mass within the left testis that does not transilluminate. The right testis is normal. There is no gynecomastia or lymphadenopathy. Scrotal ultrasonography shows a 2.8-cm hypoechoic, heterogeneous, vascular solid mass within the left testis; the right testis is normal."], "labs": [["&#945;-Fetoprotein", "2 ng/mL (normal)"], ["&#946;-hCG", "38 mIU/mL (elevated)"], ["Lactate dehydrogenase", "310 U/L (mildly elevated)"]], "after_labs": [], "stem": "Which of the following is the most appropriate next step in management?", "options": {"A": "CT-guided biopsy of retroperitoneal lymph nodes", "B": "Radical inguinal orchiectomy", "C": "Repeat ultrasonography in 6 to 8 weeks", "D": "Testis-sparing partial orchiectomy", "E": "Transscrotal needle biopsy of the mass"}, "answer": "B", "why_correct": ["A solid intratesticular mass is a malignant germ cell tumor until proven otherwise. He also has a classic risk factor: cryptorchidism (even after orchiopexy, and the risk applies to both testes). The AUA guideline is explicit: measure serum tumor markers (AFP, hCG, and LDH) before any treatment, then perform a <b>radical inguinal orchiectomy<\/b>, which is both the diagnostic biopsy and the definitive treatment of the primary tumor.", "The inguinal approach ligates the spermatic cord at the internal ring and preserves the normal lymphatic anatomy: the testis drains to the para-aortic (retroperitoneal) nodes, while the scrotal skin drains to the inguinal nodes. Violating the scrotum can seed a second lymphatic pathway and upstage the disease.", "Markers help with diagnosis and staging: AFP points to a nonseminomatous component (seminoma never raises AFP); hCG can be elevated in either. After orchiectomy, markers are repeated to their nadir and CT of the abdomen and pelvis (and chest imaging) stages the retroperitoneum. Sperm banking and a prosthesis are discussed before surgery."], "why_wrong": {"A": "Staging of the retroperitoneum is done with CT after orchiectomy, not by needle biopsy before the primary tumor has been removed.", "C": "Repeat imaging in 6 to 8 weeks is reserved for indeterminate findings with normal markers. A vascular solid mass with an elevated hCG is not indeterminate.", "D": "Testis-sparing surgery is not recommended when the contralateral testis is normal; it is considered only for bilateral tumors or a solitary testis.", "E": "Transscrotal biopsy is contraindicated because it breaches the scrotal lymphatics, risking local recurrence and inguinal spread."}, "objective": "A solid testicular mass gets tumor markers (AFP, hCG, LDH) and then radical inguinal orchiectomy. Never biopsy or operate through the scrotum.", "sources": ["Stephenson A, et al. Diagnosis and Treatment of Early-Stage Testicular Cancer: AUA Guideline. J Urol. 2019;202(2):272&#8211;281 (amended 2023)."]}, {"id": "B2-Q07", "sys": "Ethics & law", "discipline": "Pediatrics / Adolescent Medicine", "topic": "Confidential STI care for a minor", "difficulty": 3, "vignette": ["A 16-year-old girl comes alone to a community clinic because her 17-year-old boyfriend was diagnosed with chlamydia yesterday. She asks that her parents not be told; she is afraid they would make her leave home. She has no symptoms. Her last menstrual period was 2 weeks ago, and a urine pregnancy test is negative. She is doing well in school, describes the relationship as consensual, and denies coercion, substance use, or concerns about her safety at home. A urine nucleic acid amplification test for <i>Chlamydia trachomatis<\/i> returns positive later that day; the test for <i>Neisseria gonorrhoeae<\/i> is negative."], "labs": [], "after_labs": [], "stem": "Which of the following is the most appropriate next step?", "options": {"A": "Contact her parents to obtain consent before prescribing treatment", "B": "Refer her to a pediatrician who can obtain parental consent", "C": "Report the case to child protective services", "D": "Treat only after she agrees to inform her parents", "E": "Treat with doxycycline, counsel about confidentiality and partner treatment, and encourage her to talk with a trusted adult"}, "answer": "E", "why_correct": ["Every US state and the District of Columbia allow minors to consent to their own testing and treatment for sexually transmitted infections without parental involvement (a few states set a minimum age, typically 12 to 14). Confidential care is the standard endorsed by the AAP and the Society for Adolescent Health and Medicine, because fear of disclosure is a leading reason adolescents avoid care.", "So the physician treats her and keeps the visit confidential. CDC-recommended treatment for uncomplicated chlamydia is <b>doxycycline 100 mg twice daily for 7 days<\/b>; azithromycin 1 g once is an alternative when adherence is a concern or in pregnancy. She should abstain from sex for 7 days after she and her partner complete treatment, be retested in about 3 months because reinfection is common, and be offered testing for HIV and syphilis, contraception counseling, and expedited partner therapy where permitted.", "Encouraging her to involve a trusted adult, and explaining that an insurance explanation of benefits could reveal the visit, are both part of good confidential care, but neither is a condition of treatment."], "why_wrong": {"A": "Parental consent is not required for STI care, and contacting her parents against her wishes breaches confidentiality and may put her at risk of losing her home.", "B": "Referral only delays treatment and would not change the consent rules.", "C": "Chlamydia is reportable to the public health department, not to child protective services. A consensual relationship between two adolescents close in age, with no signs of abuse or coercion, is not a child protection matter in itself.", "D": "Making treatment contingent on disclosure coerces the patient and leaves an infection untreated."}, "objective": "Minors can consent to confidential STI testing and treatment in every US state. Treat chlamydia with doxycycline for 7 days, report to public health (not parents), and retest in 3 months.", "sources": ["Workowski KA, et al. Sexually Transmitted Infections Treatment Guidelines, 2021. MMWR Recomm Rep. 2021;70(4):1&#8211;187.", "Guttmacher Institute. An Overview of Consent to Reproductive Health Services by Young People (state policy summary).", "Society for Adolescent Health and Medicine and American Academy of Pediatrics. Confidentiality Protections for Adolescents and Young Adults in the Health Care Billing and Insurance Claims Process. J Adolesc Health. 2016;58(3):374&#8211;377."]}, {"id": "B2-Q08", "sys": "Biostatistics", "discipline": "Epidemiology", "topic": "Number needed to treat from absolute risk reduction", "difficulty": 3, "vignette": ["A randomized, placebo-controlled trial enrolls 4,000 patients with heart failure with reduced ejection fraction who are already receiving guideline-directed therapy. Participants are assigned to a new drug (n = 2,000) or placebo (n = 2,000) for 3 years. At the end of the trial, 150 patients in the drug group and 200 patients in the placebo group have died. The investigators report a hazard ratio for death of 0.74 (95% confidence interval 0.60 to 0.91)."], "labs": [], "after_labs": [], "stem": "Based on these results, approximately how many patients must be treated with the new drug for 3 years to prevent one death?", "options": {"A": "4", "B": "13", "C": "40", "D": "100", "E": "400"}, "answer": "C", "why_correct": ["Number needed to treat (NNT) is the reciprocal of the <b>absolute<\/b> risk reduction. Mortality was 200/2,000 = 10.0% with placebo and 150/2,000 = 7.5% with the drug, so the absolute risk reduction is 10.0% &#8722; 7.5% = 2.5% (0.025). NNT = 1/0.025 = 40 patients treated for 3 years to prevent one death.", "The relative risk reduction is 2.5%/10% = 25%, which sounds more impressive but says nothing about how many people benefit; a 25% relative reduction of a rare outcome could mean an NNT in the thousands. Always ask for the absolute numbers. The confidence interval for the hazard ratio excludes 1.0, so the benefit is statistically significant, and the NNT applies only to the trial's time frame and a population with the same baseline risk."], "why_wrong": {"A": "4 is 1 divided by the relative risk reduction (0.25). The reciprocal of a relative measure has no clinical meaning.", "B": "13 is 1 divided by the drug group's mortality (0.075), which is not a risk reduction.", "D": "100 would require an absolute risk reduction of 1 percentage point.", "E": "400 would require an absolute risk reduction of 0.25 percentage points, a decimal-place error."}, "objective": "NNT = 1 / absolute risk reduction, using the actual event rates in each arm, over the trial's follow-up period. Relative risk reduction cannot be used to compute it.", "sources": ["Laupacis A, Sackett DL, Roberts RS. An assessment of clinically useful measures of the consequences of treatment. N Engl J Med. 1988;318(26):1728&#8211;1733."]}]</script>
