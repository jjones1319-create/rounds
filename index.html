<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rounds: board prep</title>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#162033; --muted:#5A6577; --line:#D8DEE7;
  --accent:#2C5BCB; --accent-ink:#FFFFFF; --accent-soft:#E3EBFB;
  --ok:#17845A; --ok-soft:#E1F3EA; --bad:#C2342D; --bad-soft:#FBE7E5; --flag:#C98A08; --flag-soft:#FBF0D6;
  --star:#D99A0B; --star-off:#CBD3DE; --hl:#2C5BCB; --mark:#FFE98A;
  --qfs:17px; --radius:14px;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1420; --surface:#161F30; --surface2:#1C2639; --ink:#E7EBF2; --muted:#9BA6B9; --line:#2A3549;
    --accent:#7398F2; --accent-ink:#0E1420; --accent-soft:#1F2E50;
    --ok:#3FBF86; --ok-soft:#14352A; --bad:#F06C63; --bad-soft:#3D1D1D; --flag:#F0C04A; --flag-soft:#3A3014;
    --star:#F0C04A; --star-off:#3A465C; --hl:#9DB8FF; --mark:#6B5A12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1420; --surface:#161F30; --surface2:#1C2639; --ink:#E7EBF2; --muted:#9BA6B9; --line:#2A3549;
  --accent:#7398F2; --accent-ink:#0E1420; --accent-soft:#1F2E50;
  --ok:#3FBF86; --ok-soft:#14352A; --bad:#F06C63; --bad-soft:#3D1D1D; --flag:#F0C04A; --flag-soft:#3A3014;
  --star:#F0C04A; --star-off:#3A465C; --hl:#9DB8FF; --mark:#6B5A12; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; min-height:100%; overflow-x:hidden; background:var(--paper); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.app{max-width:760px; margin:0 auto}
.view{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:30px; line-height:1.12; margin:6px 0 4px; letter-spacing:-0.02em}
h2{font-size:20px; line-height:1.25; margin:26px 0 10px; letter-spacing:-0.01em}
h3{font-size:16px; margin:18px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex; gap:10px; align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stars{color:var(--star); letter-spacing:1px; white-space:nowrap}
.stars .off{color:var(--star-off)}
.icon{width:22px; height:22px; flex:none}

/* top bar of tabs */
.topline{display:flex; align-items:center; gap:10px}
.wordmark{font-weight:700; font-size:22px; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px}
.wordmark svg{width:26px; height:26px; color:var(--accent)}
.iconbtn{width:44px; height:44px; border-radius:12px; border:0; background:transparent; display:grid; place-items:center; color:var(--ink)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn[aria-pressed="true"]{color:var(--flag); background:var(--flag-soft)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 18px; border-radius:12px; border:1px solid transparent; background:var(--accent); color:var(--accent-ink); font-weight:700; text-decoration:none}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line)}
.btn.quiet{background:transparent; color:var(--accent); padding:0 10px; min-height:40px}
.btn.danger{background:var(--bad); color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:38px; padding:0 12px; font-size:14px; border-radius:10px; white-space:nowrap}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px}
.panel + .panel{margin-top:12px}
.hint{font-size:14px; color:var(--muted)}

/* segmented + chips */
.seg{display:flex; background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px}
.seg button{flex:1 1 auto; min-width:0; min-height:40px; border:0; border-radius:9px; background:transparent; font-weight:700; color:var(--muted); padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:15px}
@media (max-width:420px){ .seg button{font-size:14px} }
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:14px; font-weight:700; color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.chip .dot{width:10px; height:10px; border-radius:50%}
.chip .n{font-weight:400; opacity:.8}
.scrollx{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx > *{flex:none}
.seg.fit{display:inline-flex}
.exam-seg{margin:12px 0 0}
.boot{padding:48px 16px; text-align:center}
.boot .btn{margin-top:14px}
.list .li.static{cursor:default}
.list .li .t .meta{display:block; margin-top:4px; font-size:13px; color:var(--muted)}
.seg.fit button{flex:none; padding:0 14px}
/* MCAT "What's tested" guides */
details.gc,details.gcat,details.gt{border:1px solid var(--line); border-radius:14px; background:var(--surface); margin-top:10px}
details.gcat{background:var(--paper)}
details.gc>summary,details.gcat>summary,details.gt>summary{list-style:none; cursor:pointer; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; min-height:48px; box-sizing:border-box}
details.gc>summary::-webkit-details-marker,details.gcat>summary::-webkit-details-marker,details.gt>summary::-webkit-details-marker{display:none}
details.gc>summary::before,details.gcat>summary::before,details.gt>summary::before{content:""; flex:none; width:9px; height:9px; margin:7px 2px 0 0; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform .15s}
details[open].gc>summary::before,details[open].gcat>summary::before,details[open].gt>summary::before{transform:rotate(45deg)}
.gsum{flex:1; min-width:0; overflow-wrap:anywhere}
.gsum b{display:block}
.gsum .meta{display:block; margin-top:3px; font-size:13px; color:var(--muted)}
.gsum .meta .badge{vertical-align:middle}
.gc-body{padding:0 10px 10px}
.gcat-body{padding:0 10px 10px}
.gt-body{padding:0 14px 14px}
.know{margin:0; padding-left:20px}
.know li{margin:6px 0; font-size:15px; line-height:1.55}
.eqs{display:flex; flex-direction:column; gap:8px; margin:12px 0 4px}
.eq{overflow-x:auto; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface2); font-size:16px; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
.eq .katex-display{margin:0}
.eq .katex-display>.katex{text-align:left; white-space:nowrap}
.eq code{white-space:pre; font-size:13px; color:var(--muted)}
.tag-d{display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent); margin:0 6px 0 0; vertical-align:middle}
.chk{display:inline-flex; align-items:center; gap:10px; font-weight:700; min-height:44px; cursor:pointer}
.chk input{width:22px; height:22px; margin:0; accent-color:var(--accent)}
.gt-foot{margin-top:8px}
.refs{margin:12px 0 0; overflow-wrap:anywhere}
.refs a,.hint a{color:var(--accent)}
.ptgrid{display:grid; grid-template-columns:repeat(18, 46px); grid-auto-rows:50px; gap:3px; padding:2px 2px 6px}
.ptgrid .pt-el{border:1px solid var(--line); border-radius:7px; background:var(--surface); padding:2px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; font-size:10px; color:var(--muted); min-height:0}
.ptgrid .pt-el b{font-size:14px; color:var(--ink)}
.ptgrid .pt-el .m{font-size:9px}
.ptgrid .pt-el.f{background:var(--surface2)}
.ptgrid .pt-el.hit{border-color:var(--accent); background:var(--accent-soft); outline:2px solid var(--accent)}
.ptgrid .pt-el[style*="grid-row:8"]{margin-top:8px}
.skill{padding:12px 0; border-top:1px solid var(--line)}
.skill.first{padding-top:0; border-top:0}
.bars h3{font-size:14px; color:var(--muted)}

/* tabbar */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0; background:transparent; min-height:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; font-weight:700; color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent)}

/* home */
.status-line{font-size:17px; color:var(--muted); margin:2px 0 16px}
.resume{display:flex; gap:14px; align-items:center}
.resume .meta{flex:1}
.resume b{display:block; font-size:17px}
.start-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.start-card{border:1px solid var(--line); background:var(--surface); border-radius:18px; padding:16px; text-align:left; min-height:118px; display:flex; flex-direction:column; gap:6px}
.start-card b{font-size:18px}
.start-card span{font-size:14px; color:var(--muted)}
.start-card.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.start-card.primary span{color:inherit; opacity:.85}
.pearl{border-left:4px solid var(--accent); padding-left:14px}
.pearl .k{font-size:14px; color:var(--muted)}

/* question map */
.qmap{display:grid; grid-template-columns:repeat(auto-fill, minmax(34px,1fr)); gap:6px}
.qcell{aspect-ratio:1; border-radius:8px; border:1px solid var(--line); background:var(--surface2); font-size:12px; font-weight:700; color:var(--muted); display:grid; place-items:center; position:relative; padding:0}
.qcell.correct{background:var(--ok); border-color:var(--ok); color:#fff}
.qcell.incorrect{background:var(--bad); border-color:var(--bad); color:#fff}
.qcell.flagged::after{content:""; position:absolute; top:3px; right:3px; width:7px; height:7px; border-radius:50%; background:var(--flag); box-shadow:0 0 0 1.5px var(--surface)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:10px}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; border:1px solid var(--line)}

/* stats */
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px}
.kpi b{display:block; font-size:24px; letter-spacing:-0.02em}
.kpi span{font-size:13px; color:var(--muted)}
.bars{display:flex; flex-direction:column; gap:12px}
.bar-row .lab{display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px}
.bar{height:10px; border-radius:6px; background:var(--surface2); border:1px solid var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--ok)}

/* lists */
.list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:16px; background:var(--surface); overflow:hidden}
.li{display:flex; align-items:center; gap:12px; padding:13px 14px; border:0; border-top:1px solid var(--line); background:transparent; text-align:left; width:100%}
.li:first-child{border-top:0}
.li .t{flex:1; min-width:0}
.li .t b{display:block}
.li .t span{font-size:14px; color:var(--muted)}
.badge{font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--surface2); color:var(--muted); white-space:nowrap}
.badge.correct{background:var(--ok-soft); color:var(--ok)}
.badge.incorrect{background:var(--bad-soft); color:var(--bad)}
.badge.flag{background:var(--flag-soft); color:var(--flag)}

/* form */
.field{margin-top:18px}
.field > label, .field > .lab{display:block; font-weight:700; margin-bottom:8px}
.stepper{display:flex; align-items:center; gap:6px}
.stepper button{width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-size:22px}
.stepper output{min-width:56px; text-align:center; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.switch{display:flex; align-items:center; justify-content:space-between; gap:12px}
.toggle{width:52px; height:30px; border-radius:999px; border:0; background:var(--line); position:relative; flex:none}
.toggle::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(22px)}

/* runner */
.runner{position:fixed; inset:0; z-index:40; background:var(--paper); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.runner[hidden]{display:none}
.rbar{display:flex; align-items:center; gap:2px; padding:4px 6px; background:var(--surface); border-bottom:1px solid var(--line)}
.rbar .pos{flex:1; text-align:center; line-height:1.15}
.rbar .pos b{display:block; font-size:16px}
.rbar .pos span{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.rbar .pos span.low{color:var(--bad); font-weight:700}
.rbody{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.rcontent{max-width:760px; margin:0 auto; padding:18px 18px 28px}
.qhead{display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; color:var(--muted)}
.vig p{font-size:var(--qfs); line-height:1.62; margin:0 0 14px}
.labs{margin:4px 0 18px; border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow-x:auto}
.labs table{border-collapse:collapse; width:100%; font-size:calc(var(--qfs) - 1px); font-variant-numeric:tabular-nums}
.labs td{padding:8px 12px; border-top:1px solid var(--line)}
.labs tr:first-child td{border-top:0}
.labs td:last-child{text-align:right; font-weight:700; white-space:normal; overflow-wrap:anywhere}
.stem{font-size:var(--qfs); font-weight:700; line-height:1.5; margin:6px 0 14px}
.opts{display:flex; flex-direction:column; gap:8px}
.opt-row{display:flex; align-items:stretch; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden}
.opt{flex:1; display:flex; align-items:flex-start; gap:12px; border:0; background:transparent; text-align:left; padding:13px 6px 13px 12px; font-size:calc(var(--qfs) - 0.5px); line-height:1.45; min-height:52px; user-select:none; -webkit-user-select:none}
.opt:disabled{cursor:default}
.ol{width:30px; height:30px; flex:none; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:15px; margin-top:-2px; background:var(--surface)}
.ot{padding-top:2px}
.strike{width:46px; border:0; border-left:1px solid var(--line); background:transparent; color:var(--muted); display:grid; place-items:center}
.opt-row.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt-row.sel .ol{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.opt-row.struck .ot{text-decoration:line-through; color:var(--muted)}
.opt-row.struck .ol{opacity:.5}
.opt-row.struck .strike{color:var(--ink)}
.opt-row.is-correct{border-color:var(--ok); background:var(--ok-soft)}
.opt-row.is-correct .ol{background:var(--ok); border-color:var(--ok); color:#fff}
.opt-row.is-wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt-row.is-wrong .ol{background:var(--bad); border-color:var(--bad); color:#fff}
.opt-row.dim{opacity:.62}
.opt .res{margin-left:auto; padding-left:8px; font-weight:700; font-size:14px; white-space:nowrap; align-self:center}
.opt-row.is-correct .res{color:var(--ok)} .opt-row.is-wrong .res{color:var(--bad)}
.rfoot{display:flex; gap:8px; align-items:center; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--surface); border-top:1px solid var(--line)}
.rfoot .in{max-width:760px; margin:0 auto; width:100%; display:flex; gap:8px}
.rfoot .btn.main{flex:1}
.navbtn{width:52px; min-height:48px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center}
.navbtn:disabled{opacity:.35}

/* passages (Phase M3): one pane at a time on phones with a sticky Passage | Question toggle; side by side from 800px */
.rbody.split{display:flex; flex-direction:column; overflow:hidden}
.ptoggle{flex:none; background:var(--surface); border-bottom:1px solid var(--line); padding:8px 12px}
.ptoggle .seg{max-width:760px; margin:0 auto}
.pane{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch}
.rbody.split[data-pane="passage"] .pane.question, .rbody.split[data-pane="question"] .pane.passage{display:none}
.passage .ptitle{margin:0 0 10px; font-size:18px}
.ptext{user-select:text; -webkit-user-select:text; -webkit-touch-callout:none}
.ptext p{font-size:var(--qfs); line-height:1.66; margin:0 0 14px}
.ptext mark{background:var(--mark); color:inherit; border-radius:3px; padding:1px 0; cursor:pointer}
.psrc{margin:10px 0 0; font-style:italic}
.pfig{margin:16px 0; padding:12px; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
.pfig figcaption{font-size:14px; color:var(--muted); margin:0 0 8px; line-height:1.4}
.ftab{border-collapse:collapse; min-width:100%; font-size:calc(var(--qfs) - 1px); font-variant-numeric:tabular-nums}
.ftab th,.ftab td{padding:6px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap}
.ftab th:first-child,.ftab td:first-child{text-align:left}
.ftab th{font-weight:700; border-bottom:2px solid var(--line); vertical-align:bottom}
.pfig .scrollx{display:block}
.chart{width:100%; height:auto; display:block; max-width:520px; margin:0 auto}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .axis{stroke:var(--ink); stroke-width:1.2}
.chart .tick{font-size:11px; fill:var(--muted)}
.chart .lab{font-size:12px; fill:var(--ink); font-weight:700}
.legend{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; font-size:13px; color:var(--muted); margin-top:6px}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.struct svg{max-width:320px; height:auto; display:block; margin:0 auto}
.struct svg path[style*="stroke:#000000"]{stroke:var(--ink) !important}
.struct svg path[style*="fill:#000000"], .struct svg text[style*="fill:#000000"]{fill:var(--ink) !important}
.rvbox{margin-top:18px; padding:12px 14px; border-radius:14px; border:1px dashed var(--line); background:var(--surface2)}
.rvbox textarea{width:100%; min-height:64px; margin-top:4px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; font-size:15px; background:var(--surface); color:var(--ink); resize:vertical}
.navsep{grid-column:1/-1; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:4px}
@media (min-width:800px){
  .rbody.split{flex-direction:row}
  .ptoggle{display:none}
  .rbody.split .pane{display:block !important; flex:1 1 50%; min-width:0}
  .rbody.split .pane.passage{border-right:1px solid var(--line)}
  .rbody.split .rcontent{max-width:none}
}

.verdict{margin:22px 0 4px; padding:14px 16px; border-radius:14px; display:flex; gap:12px; align-items:center}
.verdict.ok{background:var(--ok-soft); color:var(--ok)}
.verdict.bad{background:var(--bad-soft); color:var(--bad)}
.verdict.skip{background:var(--surface2); color:var(--muted)}
.verdict b{font-size:19px; display:block}

  /* ---------- Skeleton ---------- */
  skull_frontal: { n: "Frontal bone", L: "bone", d: "Forms the forehead and the roofs of the orbits. Contains the frontal sinuses.", p: "Frontal sinusitis can spread to bone, causing osteomyelitis with a subperiosteal abscess (Pott puffy tumor)." },
  skull_parietal: { n: "Parietal bone", L: "bone", d: "Paired bones forming the roof and upper sides of the cranium; they meet at the sagittal suture.", p: "The pterion, where the frontal, parietal, temporal, and sphenoid bones meet, overlies the middle meningeal artery. A blow here can cause an epidural hematoma with a lucid interval." },
  skull_temporal: { n: "Temporal bone", L: "bone", d: "Houses the middle and inner ear (including the ossicles) and forms the lower side of the skull. Includes the mastoid and petrous parts.", p: "Basilar skull fracture signs: mastoid bruising (Battle sign), periorbital bruising (raccoon eyes), hemotympanum, and CSF otorrhea or rhinorrhea." },
  skull_zygomatic: { n: "Zygomatic bone", L: "bone", d: "The cheekbone. Forms the lateral orbital wall and floor and part of the zygomatic arch.", p: "Zygomaticomaxillary complex (tripod) fractures can injure the infraorbital nerve (V2), causing numbness of the cheek and upper lip." },
  orbit: { n: "Orbit", L: "bone", d: "Bony socket formed by seven bones: frontal, zygomatic, maxilla, lacrimal, ethmoid, sphenoid, and palatine.", p: "Orbital floor (blowout) fracture can trap the inferior rectus: impaired upward gaze, vertical diplopia, and infraorbital numbness." },
  skull_maxilla: { n: "Maxilla", L: "bone", d: "Upper jaw. Holds the upper teeth, forms most of the hard palate, and contains the maxillary sinus, the largest paranasal sinus.", p: "Le Fort fractures: I (horizontal, separates the palate), II (pyramidal, through the nasal bridge), III (craniofacial disjunction)." },
  skull_nasal: { n: "Nasal bone", L: "bone", d: "Paired small bones forming the bridge of the nose.", p: "The most commonly fractured facial bone. Always look for a septal hematoma: it needs drainage to prevent septal necrosis and saddle-nose deformity." },
  skull_mandible: { n: "Mandible", L: "bone", d: "Lower jaw; the only movable skull bone, articulating at the temporomandibular joints.", p: "Because the mandible forms a ring with the skull base, it often fractures in two places." },

  thoracicv: { n: "Thoracic vertebrae (T1–T12)", L: "bone", d: "Twelve vertebrae that articulate with the ribs; mostly hidden behind the sternum in this view.", p: "Osteoporotic compression fractures cluster in the thoracolumbar spine. Tuberculous spondylitis (Pott disease) classically affects the lower thoracic spine." },
  lumbar: { n: "Lumbar vertebrae (L1–L5)", L: "bone", d: "Five large vertebrae bearing most of the body's weight.", p: "The adult spinal cord ends at L1–L2, so lumbar puncture is done at L3–L4 or L4–L5 (a line between the iliac crests crosses about L4). Disc herniations are most common at L4–L5 and L5–S1." },
  sacrum: { n: "Sacrum", L: "bone", d: "Five fused vertebrae forming the back of the pelvis and articulating with the hip bones at the sacroiliac joints.", p: "Sacral roots S2–S4 control bladder, bowel, and sexual function. Cauda equina syndrome (saddle anesthesia, urinary retention, decreased anal tone) needs emergent MRI and decompression." },
  coccyx: { n: "Coccyx", L: "bone", d: "The tailbone: three to five small fused vertebrae.", p: "Coccydynia often follows a fall or childbirth. Pilonidal disease occurs in the skin over the sacrococcygeal region." },
  scapula: { n: "Scapula", L: "bone", d: "Shoulder blade, mostly behind the rib cage. Its glenoid fossa forms the shoulder joint with the humeral head.", p: "Winged scapula = long thoracic nerve injury (serratus anterior), classically after mastectomy with axillary dissection. A scapular fracture implies high-energy trauma; look for associated injuries." },
  ribs: { n: "Ribs", L: "bone", d: "Twelve pairs. Ribs 1–7 are true ribs (attach directly to the sternum), 8–10 are false ribs, and 11–12 are floating ribs.", p: "The intercostal vein, artery, and nerve run in the groove under each rib, so chest tubes and thoracentesis go just over the top of a rib. Lower rib fractures (9–12) should raise concern for spleen or liver injury." },
  costal: { n: "Costal cartilages", L: "bone", d: "Hyaline cartilage connecting the ribs to the sternum, giving the chest wall flexibility for breathing.", p: "Costochondritis causes reproducible chest wall tenderness. In Tietze syndrome there is visible swelling of the costal cartilages." },
  sternum: { n: "Sternum", L: "bone", d: "Breastbone: manubrium, body, and xiphoid process. The sternal angle (of Louis) marks the 2nd rib and the T4–T5 level.", p: "The sternal angle is where the trachea bifurcates and the aortic arch begins and ends. A sternal fracture should prompt evaluation for blunt cardiac injury (ECG, troponin)." },
  clavicle: { n: "Clavicle", L: "bone", d: "Collarbone connecting the sternum to the scapula (acromion); the only bony attachment of the arm to the trunk.", p: "Most commonly fractured bone in newborns (often with shoulder dystocia) and very common in children. Most fractures occur in the middle third." },
  humerus: { n: "Humerus", L: "bone", d: "Upper arm bone, from the shoulder to the elbow.", p: "Classic nerve associations: surgical neck fracture → axillary nerve (and posterior circumflex humeral artery); midshaft → radial nerve (wrist drop); supracondylar (children) → median nerve and brachial artery; medial epicondyle → ulnar nerve." },
  radius: { n: "Radius", L: "bone", d: "Lateral (thumb-side) forearm bone; rotates around the ulna for pronation and supination.", p: "Colles fracture: distal radius with dorsal displacement (fall on outstretched hand). Galeazzi: radial shaft fracture with distal radioulnar joint dislocation. Nursemaid's elbow: radial head subluxation in a toddler pulled by the arm." },
  ulna: { n: "Ulna", L: "bone", d: "Medial (little-finger-side) forearm bone; its olecranon forms the point of the elbow.", p: "Monteggia: proximal ulnar fracture with radial head dislocation (may injure the posterior interosseous nerve). Nightstick fracture: isolated ulnar shaft fracture from a defensive blow." },
  carpals: { n: "Carpal bones", L: "bone", d: "Eight wrist bones in two rows: scaphoid, lunate, triquetrum, pisiform, trapezium, trapezoid, capitate, hamate.", p: "Scaphoid is the most fractured carpal bone (snuffbox tenderness); its retrograde blood supply puts the proximal pole at risk of avascular necrosis, so treat suspected fractures even with a normal first x-ray. Lunate dislocation can compress the median nerve." },
  metacarpals: { n: "Metacarpals", L: "bone", d: "Five bones of the palm.", p: "Boxer's fracture: 5th metacarpal neck. Bennett fracture: intra-articular fracture at the base of the 1st metacarpal. A 'fight bite' over a knuckle is an open joint injury until proven otherwise." },
  hand_phalanges: { n: "Phalanges of the hand", L: "bone", d: "Fourteen per hand: two in the thumb, three in each finger.", p: "Mallet finger: extensor tendon avulsion at the DIP joint. Jersey finger: flexor digitorum profundus avulsion, usually the ring finger." },
  hipbone: { n: "Hip bone (os coxae)", L: "bone", d: "Ilium, ischium, and pubis fused at the acetabulum. Two hip bones plus the sacrum form the pelvis.", p: "Pelvic fractures can bleed massively (venous plexus and internal iliac branches); apply a pelvic binder. Blood at the urethral meatus means retrograde urethrogram before placing a Foley catheter." },
  femur: { n: "Femur", L: "bone", d: "Thigh bone; the longest and strongest bone in the body.", p: "Femoral neck fracture (shortened, externally rotated leg) risks avascular necrosis via the medial circumflex femoral artery. Shaft fractures can lose 1–1.5 L of blood and cause fat embolism (hypoxemia, confusion, petechiae)." },
  patella: { n: "Patella", L: "bone", d: "Kneecap; the largest sesamoid bone, lying within the quadriceps tendon.", p: "Patellar dislocation is almost always lateral. A displaced transverse fracture disrupts the extensor mechanism: the patient cannot do a straight-leg raise." },
  tibia: { n: "Tibia", L: "bone", d: "Shinbone; the main weight-bearing bone of the leg. Its medial malleolus forms the inner ankle.", p: "Tibial shaft fractures carry the highest risk of compartment syndrome: pain out of proportion and pain with passive stretch mean urgent fasciotomy. Osgood–Schlatter disease is tibial tubercle apophysitis in adolescent athletes." },
  fibula: { n: "Fibula", L: "bone", d: "Thin lateral leg bone, mainly for muscle attachment; its lateral malleolus forms the outer ankle.", p: "Fibular neck fracture can injure the common fibular nerve, causing foot drop. Maisonneuve fracture: proximal fibula fracture with a medial ankle/syndesmosis injury." },
  tarsals: { n: "Tarsal bones", L: "bone", d: "Seven per foot: talus, calcaneus, navicular, cuboid, and three cuneiforms.", p: "Calcaneus is the most fractured tarsal; after a fall from height, check the lumbar spine too. Talar neck fractures risk avascular necrosis." },
  metatarsals: { n: "Metatarsals", L: "bone", d: "Five long bones of the midfoot.", p: "Jones fracture (5th metatarsal metaphyseal–diaphyseal junction) heals poorly. A 2nd metatarsal stress fracture is the classic 'march fracture.'" },
  foot_phalanges: { n: "Phalanges of the foot", L: "bone", d: "Fourteen per foot: two in the great toe, three in each other toe.", p: "The 1st metatarsophalangeal joint is the classic site of gout (podagra) and of hallux valgus (bunion)." },

  /* ---------- Organs ---------- */
  brain: { n: "Brain", L: "organ", d: "Cerebrum, cerebellum, and brainstem. About 2% of body weight.", p: "The brain uses roughly 20% of the body's oxygen at rest, which is why a few minutes of global ischemia causes irreversible injury (watershed zones and hippocampus are most vulnerable)." },
  eye: { n: "Eye", L: "organ", d: "Globe within the orbit; moved by six extraocular muscles supplied by CN III, IV, and VI.", p: "Acute angle-closure glaucoma: painful red eye, fixed mid-dilated pupil, halos, nausea. It is an emergency." },
  esophagus: { n: "Esophagus", L: "organ", d: "Muscular tube (~25 cm) from C6 to the stomach, passing through the diaphragm at T10. Upper third skeletal muscle, lower third smooth muscle.", p: "Mallory–Weiss tear = mucosal tear after retching; Boerhaave syndrome = full-thickness rupture, usually distal left posterolateral wall, with mediastinitis." },
  trachea: { n: "Trachea and main bronchi", L: "organ", d: "Airway from C6 to the carina at T4–T5, held open by C-shaped cartilage rings.", p: "The right main bronchus is wider, shorter, and more vertical, so aspirated objects usually go right (right lower lobe when upright)." },
  thyroid: { n: "Thyroid gland", L: "organ", d: "Butterfly-shaped gland in front of the trachea; the isthmus lies over tracheal rings 2–4. Four parathyroid glands sit on its back.", p: "Thyroidectomy risks: recurrent laryngeal nerve injury (hoarseness) and hypocalcemia from parathyroid removal or devascularization." },
  lung_r: { n: "Right lung", L: "organ", d: "Three lobes (upper, middle, lower), separated by the horizontal and oblique fissures.", p: "Aspiration while upright goes to the right lower lobe; while supine, to the posterior segment of the right upper lobe or superior segment of the right lower lobe. Lung apices rise above the clavicle (Pancoast tumor → Horner syndrome)." },
  lung_l: { n: "Left lung", L: "organ", d: "Two lobes plus the lingula; the cardiac notch makes room for the heart.", p: "The lingula is the left lung's counterpart to the right middle lobe. Lingular consolidation blurs the left heart border on chest x-ray (silhouette sign)." },
  heart: { n: "Heart", L: "organ", d: "Four-chambered pump in the middle mediastinum; the apex sits at the left 5th intercostal space, midclavicular line.", p: "The right ventricle is the most anterior chamber (most injured in penetrating chest trauma). The left atrium is the most posterior; enlargement can compress the esophagus (dysphagia) or left recurrent laryngeal nerve (hoarseness)." },
  diaphragm: { n: "Diaphragm", L: "organ", d: "Main muscle of breathing, innervated by the phrenic nerve (C3–C5). Openings: IVC at T8, esophagus at T10, aorta at T12.", p: "Diaphragmatic irritation refers pain to the shoulder (Kehr sign with splenic rupture). Mnemonic for the openings: 'I 8 10 Eggs At 12.'" },
  liver: { n: "Liver", L: "organ", d: "Largest internal organ (~1.5 kg). Dual blood supply: portal vein (~75%) and hepatic artery (~25%).", p: "Zone 3 (centrilobular) hepatocytes are most vulnerable to ischemia and to acetaminophen toxicity, because they have the most CYP450 and the least oxygen." },
  gallbladder: { n: "Gallbladder", L: "organ", d: "Stores and concentrates bile; releases it in response to cholecystokinin.", p: "The hepatocystic (Calot) triangle (cystic duct, common hepatic duct, liver edge) contains the cystic artery. Right upper quadrant ultrasound is the first test for suspected cholecystitis." },
  stomach: { n: "Stomach", L: "organ", d: "J-shaped muscular sac in the left upper quadrant; parietal cells secrete acid and intrinsic factor.", p: "Loss of parietal cells (autoimmune gastritis, gastrectomy) means no intrinsic factor and eventual vitamin B12 deficiency." },
  spleen: { n: "Spleen", L: "organ", d: "Lymphoid organ in the left upper quadrant under ribs 9–11; filters blood and removes old red cells.", p: "Most commonly injured organ in blunt abdominal trauma. After splenectomy, vaccinate against encapsulated organisms (S. pneumoniae, H. influenzae type b, N. meningitidis); Howell–Jolly bodies appear on smear." },
  pancreas: { n: "Pancreas", L: "organ", d: "Retroperitoneal gland (except the tail) with exocrine enzymes and endocrine islets; the head sits in the duodenal C-loop.", p: "Pancreatic head cancer: painless jaundice with a palpable, nontender gallbladder (Courvoisier sign). Gallstones and alcohol cause most acute pancreatitis." },
  duodenum: { n: "Duodenum", L: "organ", d: "First part of the small intestine; C-shaped and mostly retroperitoneal. Bile and pancreatic juice enter at the ampulla in the 2nd part.", p: "A posterior duodenal ulcer can erode the gastroduodenal artery and bleed briskly. Obstruction distal to the ampulla causes bilious vomiting." },
  small_intestine: { n: "Jejunum and ileum", L: "organ", d: "Several meters of small intestine where most absorption happens.", p: "The terminal ileum absorbs vitamin B12 and bile acids; Crohn disease or ileal resection causes B12 deficiency and bile-acid diarrhea. Meckel diverticulum follows the 'rule of 2s.'" },
  colon: { n: "Large intestine (colon)", L: "organ", d: "Cecum, ascending, transverse, descending, and sigmoid colon; absorbs water and electrolytes.", p: "Watershed areas (splenic flexure and rectosigmoid junction) are most vulnerable to ischemic colitis. Sigmoid volvulus ('coffee bean' sign) typically affects older adults." },
  appendix: { n: "Appendix", L: "organ", d: "Blind-ended tube off the cecum, rich in lymphoid tissue. McBurney point lies one-third of the way from the right ASIS to the umbilicus.", p: "Appendicitis pain classically starts periumbilical (visceral, T10) and migrates to the right lower quadrant once the parietal peritoneum is irritated." },
  rectum: { n: "Rectum and anal canal", L: "organ", d: "Final segment of the gut, ending at the anus.", p: "The pectinate (dentate) line divides internal hemorrhoids above (painless, visceral innervation) from external hemorrhoids below (painful, somatic innervation)." },
  kidney: { n: "Kidney", L: "organ", d: "Retroperitoneal, about T12–L3; the right kidney sits slightly lower because of the liver.", p: "A horseshoe kidney gets caught under the inferior mesenteric artery. The left renal vein passes between the aorta and SMA, where compression (nutcracker) can cause a left varicocele or hematuria." },
  adrenal: { n: "Adrenal gland", L: "organ", d: "Cortex: zona glomerulosa (aldosterone), fasciculata (cortisol), reticularis (androgens) — 'salt, sugar, sex.' Medulla: catecholamines.", p: "The left adrenal vein drains into the left renal vein; the right drains directly into the IVC. Pheochromocytoma arises from the medulla." },
  ureter: { n: "Ureter", L: "organ", d: "Muscular tube carrying urine from kidney to bladder.", p: "'Water under the bridge': the ureter passes under the uterine artery (and the vas deferens), so it is at risk during hysterectomy. Stones lodge at the ureteropelvic junction, the pelvic brim, and the ureterovesical junction (narrowest)." },
  bladder: { n: "Urinary bladder", L: "organ", d: "Muscular reservoir behind the pubic symphysis; its dome is covered by peritoneum.", p: "Dome rupture (blow to a full bladder) leaks urine intraperitoneally and needs surgical repair; extraperitoneal rupture (often with pelvic fracture) is usually managed with catheter drainage." },
  uterus: { n: "Uterus", L: "organ", d: "Muscular organ where a pregnancy implants and develops.", p: "Leiomyomas (fibroids) are the most common benign uterine tumors. The uterine artery crosses over the ureter near the cervix." },
  uterine_tube: { n: "Uterine (fallopian) tube", L: "organ", d: "Carries the egg from the ovary to the uterus; fertilization usually occurs in the ampulla.", p: "The ampulla is the most common site of ectopic pregnancy. Prior salpingitis (chlamydia, gonorrhea) is a major risk factor." },
  ovary: { n: "Ovary", L: "organ", d: "Produces eggs, estrogen, and progesterone; its vessels run in the suspensory (infundibulopelvic) ligament.", p: "Ovarian torsion presents with sudden unilateral pelvic pain, often with an enlarged ovary or mass. The left ovarian vein drains to the left renal vein, the right to the IVC." },
  testis: { n: "Testis", L: "organ", d: "Produces sperm and testosterone; descends into the scrotum before birth.", p: "Testicular torsion: sudden pain, high-riding testis, absent cremasteric reflex; detorse within about 6 hours. The testis drains to para-aortic nodes, while scrotal skin drains to superficial inguinal nodes." },
  vas_deferens: { n: "Vas deferens", L: "organ", d: "Carries sperm from the epididymis through the inguinal canal to the ejaculatory duct.", p: "The ureter passes under the vas deferens in men ('water under the bridge'). Congenital bilateral absence of the vas is associated with cystic fibrosis." },
  prostate: { n: "Prostate", L: "organ", d: "Gland surrounding the urethra below the bladder; contributes to seminal fluid.", p: "Benign prostatic hyperplasia arises in the transition (periurethral) zone; prostate cancer most often arises in the peripheral zone, which is palpable on rectal exam." },

  /* ---------- Muscles ---------- */
  scm: { n: "Sternocleidomastoid", L: "muscle", d: "Runs from the sternum and clavicle to the mastoid. Turns the head to the opposite side. Innervated by CN XI.", p: "Congenital muscular torticollis tilts the head toward the tight muscle. The triangle between its two heads is a landmark for internal jugular line placement." },
  trapezius: { n: "Trapezius", L: "muscle", d: "Elevates, retracts, and rotates the scapula. Innervated by CN XI.", p: "Accessory nerve injury during posterior triangle lymph node biopsy causes shoulder droop and a weak shrug." },
  pectoralis: { n: "Pectoralis major", L: "muscle", d: "Adducts and internally rotates the arm. Innervated by the medial and lateral pectoral nerves.", p: "Poland syndrome: congenital absence of the pectoralis major, often with ipsilateral hand anomalies." },
  deltoid: { n: "Deltoid", L: "muscle", d: "Main shoulder abductor (after supraspinatus starts the first ~15°). Innervated by the axillary nerve.", p: "A common intramuscular injection site. Axillary nerve injury (surgical neck fracture, anterior dislocation) causes deltoid weakness and lateral shoulder numbness." },
  biceps: { n: "Biceps brachii", L: "muscle", d: "Flexes the elbow and is a powerful supinator. Innervated by the musculocutaneous nerve.", p: "Biceps reflex tests C5–C6. Rupture of the long head tendon produces a 'Popeye' bulge." },
  brachioradialis: { n: "Brachioradialis", L: "muscle", d: "Flexes the elbow, especially with the forearm mid-pronated. Innervated by the radial nerve (despite being a flexor).", p: "Brachioradialis reflex tests C5–C6 (with the biceps reflex)." },
  forearm_flexors: { n: "Forearm flexor group", L: "muscle", d: "Wrist and finger flexors arising from the medial epicondyle. Innervated mostly by the median nerve, plus the ulnar nerve.", p: "Medial epicondylitis ('golfer's elbow') involves the common flexor origin; lateral epicondylitis ('tennis elbow') involves the extensor origin." },
  rectus_abdominis: { n: "Rectus abdominis", L: "muscle", d: "Paired vertical muscles that flex the trunk, divided by tendinous intersections. Innervated by T7–T12.", p: "Rectus sheath hematoma (anticoagulation, coughing) causes a painful abdominal wall mass. Diastasis recti is separation along the linea alba." },
  external_oblique: { n: "External oblique", L: "muscle", d: "Outermost lateral abdominal muscle. Its aponeurosis forms the inguinal ligament (ASIS to pubic tubercle).", p: "Indirect inguinal hernias pass lateral to the inferior epigastric vessels through the deep ring; direct hernias push through Hesselbach triangle, medial to them." },
  adductors: { n: "Adductor group", L: "muscle", d: "Medial thigh muscles that pull the leg toward the midline. Innervated mainly by the obturator nerve.", p: "Adductor longus forms the medial border of the femoral triangle; groin strains often involve it." },
  vastus_lateralis: { n: "Vastus lateralis", L: "muscle", d: "Largest part of the quadriceps; extends the knee. Femoral nerve.", p: "The preferred intramuscular injection site in infants." },
  rectus_femoris: { n: "Rectus femoris", L: "muscle", d: "The only quadriceps muscle crossing the hip, so it both flexes the hip and extends the knee. Femoral nerve.", p: "The patellar reflex tests L3–L4 through the quadriceps and femoral nerve." },
  vastus_medialis: { n: "Vastus medialis", L: "muscle", d: "Teardrop-shaped quadriceps muscle above the medial knee; stabilizes the patella. Femoral nerve.", p: "Weakness contributes to lateral patellar tracking and patellofemoral pain." },
  sartorius: { n: "Sartorius", L: "muscle", d: "Longest muscle in the body; flexes, abducts, and laterally rotates the hip. Femoral nerve.", p: "Forms the lateral border of the femoral triangle (inguinal ligament above, adductor longus medially). Its tendon joins the pes anserinus with gracilis and semitendinosus." },
  tibialis_anterior: { n: "Tibialis anterior", L: "muscle", d: "Dorsiflexes and inverts the foot. Deep fibular nerve.", p: "Weakness causes foot drop. It lies in the anterior compartment, the compartment most often affected by compartment syndrome." },
  gastrocnemius: { n: "Gastrocnemius", L: "muscle", d: "Calf muscle that plantarflexes the foot via the Achilles tendon. Tibial nerve.", p: "Achilles rupture: a pop, then no plantarflexion when the calf is squeezed (positive Thompson test). Ankle reflex tests S1." },

  /* ---------- Veins ---------- */
  svc: { n: "Superior vena cava", L: "vein", d: "Drains the head, neck, arms, and upper chest into the right atrium.", p: "SVC syndrome (facial plethora, arm and face swelling) is usually caused by lung cancer (often small cell) or lymphoma." },
  brachiocephalic_v: { n: "Brachiocephalic vein", L: "vein", d: "Formed by the internal jugular and subclavian veins; the two join to form the SVC. The left is longer and crosses in front of the aortic arch branches.", p: "The left brachiocephalic vein receives the thoracic duct at the left venous angle." },
  ijv: { n: "Internal jugular vein", L: "vein", d: "Drains the brain and face; runs in the carotid sheath lateral to the common carotid artery.", p: "The right IJ is a favored central line site: a straight path to the SVC. Jugular venous pressure is estimated using the right IJ." },
  ejv: { n: "External jugular vein", L: "vein", d: "Superficial neck vein crossing the sternocleidomastoid.", p: "Visible distension suggests high right-sided pressure; it can be used for emergency IV access." },
  subclavian_v: { n: "Subclavian vein", L: "vein", d: "Continues the axillary vein beneath the clavicle.", p: "Subclavian central lines have the lowest infection risk but the highest pneumothorax risk. Effort thrombosis (Paget–Schroetter) affects young athletes." },
  axillary_v: { n: "Axillary vein", L: "vein", d: "Drains the arm; becomes the subclavian vein at the first rib.", p: "Receives the cephalic vein below the clavicle." },
  cephalic: { n: "Cephalic vein", L: "vein", d: "Superficial vein on the lateral arm; runs in the deltopectoral groove to join the axillary vein.", p: "A common site for peripheral IVs and for dialysis fistula creation (radiocephalic)." },
  basilic: { n: "Basilic vein", L: "vein", d: "Superficial vein on the medial arm; joins the brachial veins to form the axillary vein.", p: "A preferred vein for PICC line placement." },
  median_cubital: { n: "Median cubital vein", L: "vein", d: "Connects the cephalic and basilic veins in front of the elbow.", p: "The most common venipuncture site. The bicipital aponeurosis beneath it protects the brachial artery and median nerve." },
  ivc: { n: "Inferior vena cava", L: "vein", d: "Drains the body below the diaphragm into the right atrium; passes the diaphragm at T8.", p: "An IVC filter is an option for acute VTE when anticoagulation is contraindicated. Renal cell carcinoma can grow into the renal vein and IVC." },
  hepatic_v: { n: "Hepatic veins", L: "vein", d: "Drain the liver directly into the IVC.", p: "Budd–Chiari syndrome (hepatic vein thrombosis, e.g., with polycythemia vera or other hypercoagulable states) causes painful hepatomegaly and ascites." },
  portal_v: { n: "Hepatic portal vein", L: "vein", d: "Formed behind the pancreatic neck by the splenic vein and superior mesenteric vein; carries gut blood to the liver.", p: "Portal hypertension opens portosystemic shunts: esophageal varices (left gastric ↔ esophageal), caput medusae (paraumbilical ↔ epigastric), and rectal varices. TIPS connects the portal vein to a hepatic vein." },
  splenic_v: { n: "Splenic vein", L: "vein", d: "Runs behind the pancreas from the spleen to join the SMV.", p: "Splenic vein thrombosis (often from pancreatitis) causes isolated gastric varices via the short gastric veins." },
  smv: { n: "Superior mesenteric vein", L: "vein", d: "Drains the small intestine and right colon; lies to the right of the SMA.", p: "Mesenteric venous thrombosis is a cause of bowel ischemia in hypercoagulable states." },
  renal_v: { n: "Renal vein", L: "vein", d: "Drains each kidney into the IVC. The left is longer and receives the left gonadal and left adrenal veins.", p: "Left varicoceles are more common because the left gonadal vein enters the left renal vein at a right angle." },

  coronary: { n: "Coronary arteries", L: "artery", d: "Right coronary artery (RCA), left anterior descending (LAD), and left circumflex. Most people are right dominant (posterior descending artery from the RCA).", p: "The LAD is the most commonly occluded. Inferior MI usually means the RCA, which also supplies the right ventricle and often the AV node (bradycardia, heart block)." },

  common_carotid: { n: "Common carotid artery", L: "artery", d: "Ascends in the carotid sheath and splits at the upper border of the thyroid cartilage (C3–C4).", p: "The carotid sinus at the bifurcation senses pressure (afferent CN IX); carotid massage slows the heart via the vagus." },

  external_carotid: { n: "External carotid artery", L: "artery", d: "Supplies the face, scalp, and neck: superior thyroid, ascending pharyngeal, lingual, facial, occipital, posterior auricular, maxillary, superficial temporal.", p: "The middle meningeal artery (from the maxillary) causes epidural hematomas. The superficial temporal artery is biopsied for giant cell arteritis." },
  vertebral: { n: "Vertebral artery", L: "artery", d: "Arises from the subclavian, runs up through the cervical transverse foramina, and joins its partner to form the basilar artery.", p: "Subclavian steal: proximal subclavian stenosis reverses vertebral flow, causing arm claudication and dizziness with arm use, plus a blood pressure difference between arms." },

  radial_a: { n: "Radial artery", L: "artery", d: "Lateral forearm artery; its pulse is felt at the wrist and in the anatomical snuffbox.", p: "Usual site for arterial blood gases and arterial lines; check ulnar collateral flow first." },
  ulnar_a: { n: "Ulnar artery", L: "artery", d: "Medial forearm artery; passes through the Guyon canal with the ulnar nerve.", p: "Hypothenar hammer syndrome: repetitive palm trauma causes ulnar artery thrombosis and finger ischemia." },
  palmar_arch: { n: "Palmar arches", L: "artery", d: "Superficial arch (mainly ulnar) and deep arch (mainly radial) give the fingers dual supply.", p: "This dual supply is why radial artery cannulation is usually tolerated." },
  celiac: { n: "Celiac trunk", L: "artery", d: "Arises at T12; supplies the foregut through the left gastric, splenic, and common hepatic arteries.", p: "Median arcuate ligament syndrome: compression of the celiac trunk causes postprandial pain and weight loss." },
  sma: { n: "Superior mesenteric artery", L: "artery", d: "Arises at L1; supplies the midgut, from the distal duodenum to the proximal two-thirds of the transverse colon.", p: "Acute mesenteric ischemia (often an embolus in atrial fibrillation) causes pain out of proportion to exam. SMA syndrome: rapid weight loss lets the SMA compress the 3rd part of the duodenum." },
  renal_a: { n: "Renal artery", L: "artery", d: "Arises at about L1–L2 and enters the kidney at the hilum.", p: "Renovascular hypertension: fibromuscular dysplasia in young women ('string of beads'), atherosclerosis in older adults. ACE inhibitors can precipitate AKI with bilateral stenosis." },
  ima: { n: "Inferior mesenteric artery", L: "artery", d: "Arises at L3; supplies the hindgut, from the distal transverse colon to the upper rectum.", p: "A horseshoe kidney is trapped beneath the IMA during ascent." },
  common_iliac_a: { n: "Common iliac artery", L: "artery", d: "Formed at the aortic bifurcation (about L4, near the umbilicus); divides into internal and external iliac arteries.", p: "Aortoiliac occlusive disease (Leriche syndrome): buttock claudication, absent femoral pulses, and erectile dysfunction." },

  femoral_a: { n: "Femoral artery", L: "artery", d: "Main artery of the thigh, in the femoral triangle lateral to the femoral vein.", p: "A common access site for cardiac catheterization; complications include pseudoaneurysm and retroperitoneal bleeding." },
  popliteal_a: { n: "Popliteal artery", L: "artery", d: "Deep artery behind the knee (dashed: on the back).", p: "Knee dislocation can tear it; check the ankle-brachial index and image if abnormal. Popliteal aneurysm is the most common peripheral aneurysm and is often bilateral.", post: true },

  posterior_tibial: { n: "Posterior tibial artery", L: "artery", d: "Runs in the deep posterior compartment (dashed: on the back).", p: "Its pulse is felt behind the medial malleolus, in the tarsal tunnel with the tibial nerve.", post: true },

  femoral_n: { n: "Femoral nerve", L: "nerve", d: "L2–L4; passes under the inguinal ligament lateral to the femoral artery to supply the quadriceps and anterior thigh skin.", p: "Injury causes weak knee extension and a diminished patellar reflex." },
  saphenous_n: { n: "Saphenous nerve", L: "nerve", d: "Sensory branch of the femoral nerve to the medial leg and foot; travels with the great saphenous vein.", p: "Can be injured during vein harvest or varicose vein surgery, causing medial leg numbness." },

/* ---------- Dictionary assembly ---------- */
function buildDictionary() {
  const out = [];
  const seen = new Set();
  FIG.structures.forEach((o) => {
    if (o.noTap) return; const key = o.info || o.id; if (seen.has(key)) return; seen.add(key);
    const inf = INFO[key]; if (!inf) return;
    const lay = LAYERS.find((l) => l.k === inf.L);
    out.push({ id: key, name: inf.n, model: "body", sys: lay ? lay.n : "", sub: inf.L === "derm" ? "Dermatome" : lay.n, target: { kind: "body", key } });
  });
  CN.forEach((c) => out.push({ id: "cn_" + c.num, name: `Cranial nerve ${c.num} (${c.name})`, model: "brain", sys: "Cranial nerves", sub: "Cranial nerve", target: { kind: "cn", num: c.num } }));
  BRAIN.lobes.concat(BRAIN.areas, BRAIN.territories).forEach((a) => out.push({ id: "br_" + a.id, name: a.n, model: "brain", sys: "Brain", sub: BRAIN.territories.includes(a) ? "Arterial territory" : "Brain", target: { kind: "brain", id: a.id } }));
  HEART.outside.concat(HEART.inside).forEach((h) => out.push({ id: "ht_" + h.id, name: h.n, model: "heart", sys: "Heart", sub: "Heart", target: { kind: "heart", id: h.id, view: HEART.outside.includes(h) ? "outside" : "inside" } }));
  const sortKey = (s) => s.replace(/^(right|left) /i, "").toLowerCase();
  out.sort((a, b) => sortKey(a.name).localeCompare(sortKey(b.name)));
  return out;
}

      <div class="scrollx" style="margin-top:10px" role="group" aria-label="Filter">${filters.map(([k, n]) => `<button class="chip" data-act="idx-filter" data-v="${k}" aria-pressed="${Idx.filter === k}">${n}</button>`).join("")}</div>
      <p class="hint" style="margin:10px 2px 6px">${list.length} entr${list.length === 1 ? "y" : "ies"}. Tap one to see it highlighted on its model.</p><div id="idxlist">`;
    h += indexListHTML(list) + `</div>`;
    return h;
  }
  function indexListHTML(list) {
    if (!list.length) return `<p class="muted">No match.</p>`;
    const sortKey = (s) => s.replace(/^(right|left) /i, "");
    let out = "", letter = "";
    const useLetters = !Idx.q.trim();
    list.forEach((e) => {
      const L = sortKey(e.name).charAt(0).toUpperCase();
      if (useLetters && L !== letter) { letter = L; out += `${out ? "</div>" : ""}<div class="idx-letter">${L}</div><div class="list">`; }
      else if (!out) out += `<div class="list">`;
      const col = e.model === "body" ? (layerOf(e.id) || { c: "#999" }).c : e.model === "brain" ? "#8E5CC4" : "#D2352E";
      out += `<button class="li" data-act="dict-go" data-id="${e.id}"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:${col};flex:none"></span><div class="t"><b>${esc(e.name)}</b><span>${esc(e.sub)}</span></div>${IC.right}</button>`;
    });
    return out + "</div>";
  }
  function openEntry(id) {
    const e = DICT.find((x) => x.id === id); if (!e) return;
    const t = e.target;
    if (t.kind === "body") showOnBody(t.key);
    else if (t.kind === "cn" && Brain.mode === "3d") showInScene("brain", "cn_" + t.num);
    else if (t.kind === "brain" && Brain.mode === "3d") showInScene("brain", "br_" + t.id);
    else if (t.kind === "heart" && Heart.mode === "3d") showInScene("heart", "ht_" + t.id);
    else if (t.kind === "cn") { Brain.cn = t.num; UIA.tab = "brain"; Brain.view = "underside"; appHooks.go("anatomy"); }
    else if (t.kind === "brain") { Brain.sel = t.id; if (BRAIN.territories.some((x) => x.id === t.id)) Brain.terr = true; UIA.tab = "brain"; Brain.view = "lateral"; appHooks.go("anatomy"); }
    else if (t.kind === "heart") { Heart.sel = t.id; Heart.view = t.view; UIA.tab = "heart"; appHooks.go("anatomy"); }
  }

  /* ================= BONES ================= */
  function bonesHTML() {
    const total = BONES.reduce((a, g) => a + g.items.reduce((b, it) => b + it[1], 0), 0);
    const axial = BONES.filter((g) => g.axial).reduce((a, g) => a + g.items.reduce((b, it) => b + it[1], 0), 0);
    return `<div class="panel" style="margin-top:14px"><h3 style="margin:0">${total} bones in the adult skeleton</h3>
      <div class="bone-sum" role="img" aria-label="${axial} axial and ${total - axial} appendicular bones"><i style="width:${(axial / total) * 100}%;background:var(--accent)"></i><i style="width:${((total - axial) / total) * 100}%;background:var(--star)"></i></div>
      <p class="small muted" style="margin:0">${axial} axial (skull, ossicles, hyoid, spine, ribs, sternum) and ${total - axial} appendicular (limbs and girdles). The 8 carpals and 7 tarsals per side are listed one by one.</p></div>
      <input class="search" style="margin-top:12px" type="search" id="bonesearch" placeholder="Search bones and fracture pearls" aria-label="Search bones"><div id="bonelist">${boneGroupsHTML("")}</div>`;
  }
  function boneGroupsHTML(q) {
    q = q.trim().toLowerCase();
    const out = BONES.map((g) => {
      const items = g.items.filter((it) => !q || it[0].toLowerCase().includes(q) || it[2].toLowerCase().includes(q));
      if (!items.length) return "";
      const cnt = g.items.reduce((a, it) => a + it[1], 0);
      return `<details class="bgroup" ${q ? "open" : ""}><summary>${esc(g.g)}<span class="c">${cnt} bone${cnt > 1 ? "s" : ""}</span></summary>${items.map((it) => `<div class="bone"><div class="bh"><b>${esc(it[0])}</b><span class="x">×${it[1]}</span></div><p>${esc(it[2])}</p>${it[3] && INFO[it[3]] ? `<button class="btn quiet sm" style="padding:0" data-act="show-fig" data-fig="${it[3]}">Show on the body</button>` : ""}</div>`).join("")}</details>`;
    }).join("");
    return out || `<p class="muted" style="margin-top:12px">No bone matches that search.</p>`;
  }

  /* ================= events ================= */
  function handle(act, t, v) {
    switch (act) {
      case "atab": UIA.tab = v; rerender(); return true;
      case "layer": if (Body.layers.has(v)) Body.layers.delete(v); else Body.layers.add(v); syncChips(); if (Body.mode === "3d") sync3DLayers(); if (Body.sel && !Body.quiz) { const so = ID2S[Body.sel.replace(/-(r|l)$/, "")]; if (so && !Body.layers.has(INFO[so.info || so.id].L)) { Body.sel = null; $("#infocard").innerHTML = infoCardHTML(); } } applyFigState(); return true;
      case "layers-all": { const keys = (Body.mode === "3d" ? LAYERS3() : LAYERS).map((l) => l.k), all = keys.every((k) => Body.layers.has(k)); Body.layers = all ? new Set(["bone", "organ"]) : new Set([...Body.layers, ...keys]); syncChips(); applyFigState(); if (Body.mode === "3d") sync3DLayers(); return true; }
      case "sex": Body.sex = v; $$("[data-act=sex]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === v)); if (Body.sel) { const so = ID2S[Body.sel.replace(/-(r|l)$/, "")]; if (so && so.sex && so.sex !== v) { Body.sel = null; $("#infocard").innerHTML = infoCardHTML(); } } applyFigState(); return true;
      case "rotate-body": rotateBody(); return true;
      case "body3d-retry": rerender(true); return true;
      case "scene-mode": case "s3-layer": case "s3-all": case "s3-zoom": case "q3-start": case "q3-pick": case "q3-next": case "q3-stop": return sceneAct(act, t, v);
      case "brain-side": { Brain.side = v || null; const view = sceneV("brain"); $$("[data-act=brain-side]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === (v || ""))); if (view && view.isReady()) { view.setSide(Brain.side); view.look(Brain.side === "L" ? [-1, 0.08, 0.1] : [1, 0.08, 0.1]); } return true; }
      case "reload-app": location.reload(); return true;
      case "body-mode": if (Body.mode !== v) { if (v === "3d" && !Body.t3) Body.t3 = performance.now(); if (Body.quiz && Body.quiz.three && B3) B3.clear(); Body.quiz = null; Body.mode = v; saveModes(); rerender(true); } return true;
      case "zoom-in": if (Body.mode === "3d") { if (B3 && B3.isReady()) B3.zoom(1 / 1.5); } else animateVB(zoomBy(1 / 1.5)); return true;
      case "zoom-out": if (Body.mode === "3d") { if (B3 && B3.isReady()) B3.zoom(1.5); } else animateVB(zoomBy(1.5)); return true;
      case "zoom-fit": if (Body.mode === "3d") { if (B3 && B3.isReady()) B3.fit(); } else animateVB({ x: 0, y: 0, w: 400, h: 920 }); return true;
      case "bpick": Body.q = ""; $("#bsearch").value = ""; $("#bresults").innerHTML = ""; showOnBody(t.dataset.key); return true;
      case "show-fig": showOnBody(t.dataset.fig); return true;
      case "id-quiz": startIdQuiz(); return true;
      case "id-quiz-stop": if (Body.quiz && Body.quiz.three && B3) { B3.clear(); Body.sel3 = null; } Body.quiz = null; Body.sel = null; applyFigState(); $("#infocard").innerHTML = infoCardHTML(); return true;
      case "id-pick": quizPick(t.dataset.key); return true;
      case "id-next": nextIdQuestion(); return true;
      case "rotate-brain": rotateBrain(); return true;
      case "brain-terr": Brain.terr = !Brain.terr; t.setAttribute("aria-pressed", Brain.terr); $("#brainwrap").innerHTML = brainFigure(); return true;
      case "brain-pick": selectBrain(v); return true;
      case "cn": selectCN(v); return true;
      case "cn-quiz": openCNQuiz(); return true;
      case "quiz-pick": cnQuizPick(+t.dataset.i); return true;
      case "quiz-next": Quiz.i++; Quiz.answered = false; renderCNQuiz(); return true;
      case "quiz-again": Quiz.qs = buildCNQuiz(); Quiz.i = 0; Quiz.score = 0; Quiz.answered = false; renderCNQuiz(); return true;
      case "rotate-heart": rotateHeart(); return true;
      case "heart-pick": selectHeart(v); return true;
      case "idx-filter": Idx.filter = v; rerender(true); return true;
      case "dict-go": appHooks.closeSheet(); openEntry(t.dataset.id); return true;
    }
    return false;
  }
  function input(t) {
    if (t.id === "heartcut") { Heart.cut = +t.value; const v = sceneV("heart"); if (v && v.isReady()) v.setCut(Heart.cut ? Heart.cut / 100 : null); const o = $("#heartcutv"); if (o) o.textContent = Heart.cut ? Heart.cut + "%" : "Closed"; return true; }
    if (t.id === "bonesearch") { $("#bonelist").innerHTML = boneGroupsHTML(t.value); return true; }
    if (t.id === "idxsearch") { Idx.q = t.value; const list = Idx.q.trim() ? searchDict(Idx.q.trim()) : DICT; $("#idxlist").innerHTML = indexListHTML(Idx.filter === "all" ? list : list.filter((e) => Idx.filter === "derm" ? e.sub === "Dermatome" : Idx.filter === "cn" ? e.sub === "Cranial nerve" : Idx.filter === "body" ? (e.model === "body" && e.sub !== "Dermatome") : (e.model === Idx.filter && e.sub !== "Cranial nerve"))); return true; }
    return false;
  }
  function init(hooks) { appHooks = hooks; }
  return { view, mount, handle, input, showOnBody, openEntry, init, dict: DICT, body: Body };
})();

</script>
<script>
(function () {
  "use strict";
  /* Question banks are fetched at boot (data/boards.json, data/mcat.json). QB, QMAP, QNUM and SYSTEMS always describe the
     selected exam's bank, so the boards code below is unchanged; the MCAT bank stays empty until PLAN_MCAT Phase M2. */
  const EXAMS = { boards: { key: "rounds.progress.v1", name: "Boards" }, mcat: { key: "rounds.mcat.v1", name: "MCAT" } };
  const EXAM_KEY = "rounds.exam";                       // which exam is selected (a convenience, not progress)
  const Bank = { boards: [], mcat: { sections: [], items: [], passages: [], guides: {} } };
  const MAPS = { boards: {}, mcat: {} };                 // id -> question, per exam
  let EXAM = "boards", QB = [], QMAP = {}, QNUM = {}, SYSTEMS = [], ready = false, PMAP = {};
  function activate(exam) {
    EXAM = exam; QB = exam === "boards" ? Bank.boards : Bank.mcat.items; QMAP = MAPS[exam];
    QNUM = Object.fromEntries(QB.map((q, i) => [q.id, i + 1])); SYSTEMS = [...new Set(QB.map((q) => q.sys))];
    P.systems = new Set(SYSTEMS);
    if (exam === "mcat") { P.sections = new Set(Bank.mcat.sections.map((s) => s.k)); P.skills = new Set(["1", "2", "3", "4"]); P.diffs = new Set([2, 3, 4, 5]); P.perQ = 96; }
    else { P.diffs = new Set([3, 4, 5]); P.perQ = 90; }
  }
  const MCAT_PERQ = { chem_phys: 96, bio_biochem: 96, psych_soc: 96, cars: 102 };
  const CARS_SKILL = { foundations: "Foundations of comprehension", within: "Reasoning within the text", beyond: "Reasoning beyond the text" };   // seconds: 95 min / 59 questions, 90 min / 53
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const stars = (n) => `<span class="stars" aria-label="Difficulty ${n} of 5">${"★".repeat(n)}<span class="off">${"★".repeat(5 - n)}</span></span>`;
  const fmt = (s) => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60), r = s % 60; return m + ":" + String(r).padStart(2, "0"); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- icons ---------------- */
  const I = (p, extra = "") => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${extra}>${p}</svg>`;
  const ICON = {
    home: I('<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>'),
    practice: I('<rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12.5h8M8 16.5h5"/>'),
    body: I('<circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 9.5l5 1.5 5-1.5M9 21l3-7 3 7"/>'),
    chart: I('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
    gear: I('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
    x: I('<path d="M6 6l12 12M18 6 6 18"/>'),
    flag: I('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
    labs: I('<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/>'),
    more: I('<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>'),
    left: I('<path d="M15 5l-7 7 7 7"/>'),
    right: I('<path d="M9 5l7 7-7 7"/>'),
    strike: I('<path d="M4 12h16"/><path d="M8 7.5c1-1.6 2.6-2.5 4.4-2.5 2.2 0 3.6 1 4.1 2.4M16 16.5c-1 1.6-2.6 2.5-4.4 2.5-2.3 0-3.8-1.1-4.3-2.6"/>'),
    plus: I('<path d="M12 5v14M5 12h14"/>'),
    minus: I('<path d="M5 12h14"/>'),
    fit: I('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'),
    search: I('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>'),
    table: I('<rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 10h17M3.5 15h17M9 5v14M15 5v14"/>'),
    check: I('<path d="m5 12.5 4.5 4.5L19 7"/>'),
    logo: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="12.5"/><path d="M5 17h6l2.5-5 4 9 2.5-4H27"/></svg>',
  };

  /* ---------------- storage ---------------- */
  const fresh = () => ({ v: 1, answers: {}, flags: {}, notes: {}, sessions: [], settings: { theme: "system", font: 1, ts: 0 }, updatedAt: 0 });
  function normalize(d, qmap) {
    const f = fresh();
    if (!d || typeof d !== "object") return f;
    for (const k in f) if (d[k] == null) d[k] = f[k];
    d.settings = Object.assign(fresh().settings, d.settings || {});
    if (!Array.isArray(d.sessions)) d.sessions = [];
    d.sessions = d.sessions.filter((s) => s && Array.isArray(s.qids) && s.qids.every((id) => qmap[id]));
    return d;
  }
  /* One progress record per exam, each under its own localStorage key. Store.d is the selected exam's record. The boards
     key (rounds.progress.v1) keeps its original shape, and the app settings (theme, text size) live in it. */
  const Store = {
    all: { boards: null, mcat: null },
    get d() { return this.all[EXAM]; },
    set d(v) { this.all[EXAM] = v; },
    settings() { return this.all.boards.settings; },
    read(exam) { let d = null; try { d = JSON.parse(localStorage.getItem(EXAMS[exam].key) || "null"); } catch (e) { d = null; } return normalize(d, MAPS[exam]); },
    load() { for (const exam in EXAMS) this.all[exam] = this.read(exam); },
    pristine(d) { return !d.updatedAt && !d.settings.ts && !d.sessions.length && !Object.keys(d.answers).length && !Object.keys(d.flags).length && !Object.keys(d.notes).length && !Object.keys(d.reviewed || {}).length && !Object.keys(d.review || {}).length && !d.reviewMode; },
    local() {                                           // an exam that has never been used gets no record at all
      if (this.pristine(this.d)) return;
      try { localStorage.setItem(EXAMS[EXAM].key, JSON.stringify(this.d)); } catch (e) { /* storage unavailable */ }
    },
    save() { if (!this.pristine(this.d)) { this.d.updatedAt = Date.now(); this.local(); } Sync.schedule(); },
    saveSettings() {                                   // settings live in the boards record, whichever exam is selected
      this.settings().ts = Date.now();
      if (EXAM === "boards") { this.save(); return; }
      try { localStorage.setItem(EXAMS.boards.key, JSON.stringify(this.all.boards)); } catch (e) { /* storage unavailable */ }
    },
  };
  function mergeInto(L, R) {
    R = normalize(R, MAPS.boards);
    for (const id in R.answers) {
      const a = L.answers[id], b = R.answers[id];
      if (!a) L.answers[id] = b;
      else {
        const first = (a.first && b.first && b.first.ts < a.first.ts) ? b.first : a.first || b.first;
        L.answers[id] = Object.assign({}, (b.ts || 0) > (a.ts || 0) ? b : a, { first, n: Math.max(a.n || 1, b.n || 1) });
      }
    }
    ["flags", "notes"].forEach((k) => { for (const id in R[k]) { const a = L[k][id], b = R[k][id]; if (!a || (b.ts || 0) > (a.ts || 0)) L[k][id] = b; } });
    const byId = Object.fromEntries(L.sessions.map((s) => [s.id, s]));
    R.sessions.forEach((s) => { const m = byId[s.id]; if (!m) L.sessions.push(s); else if ((s.updated || 0) > (m.updated || 0)) Object.assign(m, s); });
    L.sessions.sort((a, b) => (b.created || 0) - (a.created || 0));
    L.sessions = L.sessions.slice(0, 60);
    if ((R.settings.ts || 0) > (L.settings.ts || 0)) L.settings = R.settings;
  }
  const Sync = {
    ref: null, status: "local", timer: null, writing: false, pending: false, last: "",
    async init() {
      if (!window.claude || typeof window.claude.use !== "function") return;
      try {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (!db || !user) return;
        const id = await user.id();
        if (!id) return;
        const ref = db.doc("data/users/" + id + "/progress");
        const snap = await ref.get();
        if (snap.exists) { mergeInto(Store.all.boards, JSON.parse(JSON.stringify(snap.data()))); if (EXAM === "boards") Store.local(); applySettings(); render(); }
        this.ref = ref; this.status = "sync";
        this.schedule();
        refreshSyncLabels();
      } catch (e) { this.ref = null; this.status = "local"; refreshSyncLabels(); }
    },
    schedule() { if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1800); },
    async flush() {
      if (!this.ref) return;
      if (this.writing) { this.pending = true; return; }
      this.writing = true;
      const body = JSON.stringify(Store.all.boards);
      if (body === this.last) { this.writing = false; return; }
      try { await this.ref.set(JSON.parse(body)); this.last = body; this.status = "sync"; }
      catch (e) {
        const code = e && e.code;
        if (code === "unavailable" || code === "resource_exhausted") setTimeout(() => this.schedule(), 4000 + Math.random() * 2000);
        else { this.ref = null; this.status = "local"; }
      }
      this.writing = false;
      if (this.pending) { this.pending = false; this.schedule(); }
      refreshSyncLabels();
    },
  };
  function syncText() { return Sync.status === "sync" ? "Your progress syncs to your Claude account, so it follows you across devices." : "Your progress is saved in this browser on this device."; }
  function refreshSyncLabels() { $$("[data-sync]").forEach((el) => (el.textContent = syncText())); }

  /* ---------------- derived state ---------------- */
  const A = (id) => Store.d.answers[id];
  const isFlag = (id) => !!(Store.d.flags[id] && Store.d.flags[id].on);
  const lastStatus = (id) => { const a = A(id); return !a ? "unused" : a.ok ? "correct" : "incorrect"; };
  const firstOk = (id) => { const a = A(id); return a && a.first ? a.first.ok : null; };
  function record(id, c, t) {
    const ok = c === QMAP[id].answer, now = Date.now(), a = A(id);
    if (!a) Store.d.answers[id] = { first: { c, ok, ts: now }, c, ok, t: Math.round(t || 0), ts: now, n: 1 };
    else Object.assign(a, { c, ok, t: Math.round(t || 0), ts: now, n: (a.n || 1) + 1 });
    return ok;
  }
  function pool(name) {
    if (name === "unused") return QB.filter((q) => !A(q.id));
    if (name === "incorrect") return QB.filter((q) => lastStatus(q.id) === "incorrect");
    if (name === "flagged") return QB.filter((q) => isFlag(q.id));
    return QB.slice();
  }
  const activeSession = () => Store.d.sessions.find((s) => !s.done && !s.temp);

  /* ---------------- UI state ---------------- */
  const UI = { tab: "home", ptab: "new", missedOnly: false, msec: null, mtab: "guide" };   // msec: the open MCAT section screen

  /* ---------------- progress ---------------- */
  function viewProgress() {
    const s = summary();

  /* ---------------- sessions ---------------- */
  function startSession(mode, qs, opts = {}) {
    if (!qs.length) { toast("No questions match."); return; }
    const act = opts.temp ? null : activeSession();
    if (act && !opts.force) {
      openSheet("You have a block in progress", `<p>Starting a new block will discard your unfinished ${act.mode} block (question ${act.idx + 1} of ${act.qids.length}).</p>
        <div class="row wrap" style="margin-top:16px"><button class="btn ghost" data-act="resume" data-autofocus>Resume it instead</button><button class="btn danger" data-act="force-start">Discard and start new</button></div>`);
      pendingStart = () => startSession(mode, qs, Object.assign({}, opts, { force: true }));
      return;
    }
    if (act) Store.d.sessions = Store.d.sessions.filter((s) => s !== act);
    const ids = withPassages(opts.shuffle === false ? qs : shuffle(qs), !!opts.temp).map((q) => q.id);
    const s = { id: uid(), mode, created: Date.now(), updated: Date.now(), qids: ids, idx: 0, resp: {}, sel: {}, strike: {}, hl: {}, qtime: {}, elapsed: 0,
      limit: mode === "timed" ? ids.length * (opts.perQ || 90) : null, done: false, temp: !!opts.temp };
    if (!s.temp) { Store.d.sessions.unshift(s); Store.d.sessions = Store.d.sessions.slice(0, 60); Store.save(); }
    openRunner(s, { idx: 0 });
  }
  let pendingStart = null;
  /* Passage sets travel together: picking any question of a passage brings its whole set, in order, placed where the first
     member fell (docs/PLAN_MCAT.md, Phase M3). Temporary review sessions keep exactly the ids they were given. */
  function withPassages(qs, temp) {
    if (temp || EXAM !== "mcat") return qs;
    const out = [], seen = new Set();
    for (const q of qs) {
      if (seen.has(q.id)) continue;
      const set = q.passage ? QB.filter((x) => x.passage === q.passage) : [q];
      for (const x of set) if (!seen.has(x.id)) { seen.add(x.id); out.push(x); }
    }
    return out;
  }
  function quickStart(mode) {
    let qs = pool("unused");
    if (!qs.length) qs = pool("all");
    startSession(mode, qs.slice(0, 40), { perQ: 90 });

  /* ---------------- content review (docs/PLAN_MCAT.md, Phase M4; MCAT_SPEC §7) ----------------

  function saveMcat() { if (EXAM === "mcat") Store.save(); else { try { if (!Store.pristine(Store.all.mcat)) localStorage.setItem(EXAMS.mcat.key, JSON.stringify(Store.all.mcat)); } catch (e) { /* ignore */ } } }
  function setReviewStatus(id, s, note) {

    saveMcat();

      <div class="field switch" style="margin-top:0"><span class="lab" style="margin:0">Review mode (adds review controls to explanations and passages)</span><button class="toggle" role="switch" aria-checked="${on}" aria-label="Review mode" data-act="rv-mode"></button></div>
      ${on ? `<div class="field"><label class="lab" for="rv-name">Reviewer name (written into reviewed_by)</label><input id="rv-name" class="search" type="text" value="${esc(Store.all.mcat.reviewer || "")}" placeholder="Your name" data-reviewer></div>` : ""}

        <div class="bar-row"><div class="lab"><span>Guide topics</span><span class="muted">${tr} of ${topics.length} ticked</span></div><div class="bar" role="img" aria-label="${pct(tr, topics.length)}% ticked"><i style="width:${pct(tr, topics.length)}%"></i></div></div></div>

    return `${examSeg()}<p style="margin:14px 0 0"><button class="btn quiet sm" data-act="rv-back">${ICON.left} Progress</button></p><h1>Review questions</h1>
      <div class="chips" style="margin-top:12px">${[["draft", "Draft"], ["reviewed", "Reviewed"], ["all", "All"]].map(([k, n]) => `<button class="chip" data-act="rv-filter" data-v="${k}" aria-pressed="${RVF.status === k}">${n} <span class="n">${all.filter((q) => k === "all" || effStatus(q) === k).length}</span></button>`).join("")}</div>

  }

    const resp = {}; ids.forEach((x) => { const a = A(x); if (a) resp[x] = { c: a.c, ok: a.ok }; });
    const s = { id: uid(), mode: "tutor", temp: true, done: true, qids: ids, resp, sel: {}, strike: {}, hl: {}, qtime: {}, elapsed: 0, idx: 0 };

  }
  function reviewBoxHTML(x, kind) {
